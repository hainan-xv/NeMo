<!doctype html>
<!-- Browser front-end for the self-correcting SCRIPT demo.
     Served by scripts/asr_web.py together with its WebSocket on one port. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCRIPT — self-correcting streaming ASR</title>
<style>
  :root { --bg:#ffffff; --fg:#17191c; --mut:#6b7280; --accent:#76b900; --bad:#d93025;
          --line:#e2e5ea; --surf:#f5f6f8; --surf2:#eceef2; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { padding:18px 28px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; font-weight:600; letter-spacing:.2px; }
  .controls { display:flex; align-items:center; gap:10px; margin-left:auto; flex-wrap:wrap; }
  label { color:var(--mut); font-size:13px; }
  select { background:var(--surf); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:13px; }
  button { border:0; border-radius:999px; padding:11px 26px; font-size:15px; font-weight:600; cursor:pointer;
           background:var(--accent); color:#0d0f12; transition:background .15s, transform .05s; }
  button:active { transform:scale(.98); }
  button.rec { background:var(--bad); color:#fff; }
  button:disabled { background:var(--surf2); color:#9aa1ab; cursor:default; }
  #dot { width:9px; height:9px; border-radius:50%; background:#c6cad1; display:inline-block; margin-right:7px; vertical-align:middle; }
  #dot.on { background:var(--bad); animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  main { padding:28px; max-width:980px; }
  #out { font-size:23px; line-height:1.7; min-height:220px; white-space:pre-wrap; word-wrap:break-word; }
  .struck { text-decoration:line-through; text-decoration-thickness:2px; color:var(--mut); }
  .prov { color:var(--mut); }
  #final { margin-top:26px; padding-top:18px; border-top:1px solid var(--line); font-size:18px; display:none; }
  #final .lbl { color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.9px; margin-bottom:8px; }
  #log { margin-top:18px; color:var(--mut); font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }
  .hint { color:var(--mut); font-size:13px; }
  #bias { margin-bottom:22px; }
  #bias input { width:100%; background:var(--surf); color:var(--fg); border:1px solid var(--line);
                border-radius:8px; padding:11px 14px; font-size:14px; font-family:inherit; }
  #bias input::placeholder { color:#9aa1ab; }
  #bias input:focus { outline:none; border-color:var(--accent); }
  button.mini { padding:3px 11px; font-size:11px; font-weight:500; background:var(--surf2); color:var(--mut); margin-left:10px; }
  button.mini:hover { background:#dfe2e7; color:var(--fg); }
</style>
</head>
<body>
<header>
  <h1><span id="dot"></span><span id="htitle">SCRIPT — self-correcting streaming ASR</span></h1>
  <div class="controls">
    <label>mic</label><select id="mic"><option value="">default</option></select>
    <span id="armsel" hidden>
      <label>model</label><select id="arm">
        <option value="script">SCRIPT</option>
        <option value="interleaved">interleaved</option>
      </select>
    </span>
    <span id="scriptctl">
      <label>fast</label><select id="fast"></select>
      <label>slow</label><select id="slow"></select>
      <label>delay</label><select id="fdelay"></select><span class="hint">/</span><select id="sdelay"></select>
    </span>
    <span id="ilctl" hidden>
      <label>chunk</label><select id="ilchunk"></select>
      <label>delay</label><select id="ildelay"></select>
    </span>
    <button id="rec">Record</button>
  </div>
</header>
<main>
  <div id="bias">
    <input id="prompt_extra" type="text" spellcheck="false"
      placeholder="optional prompt, appended to the instruction - e.g. &quot;The audio may contain the names Hainan, Crichton and Vanderpool.&quot;">
  </div>
  <div id="out"><span class="hint" id="intro">Press Record and speak. Provisional words appear greyed; when the slow front
overrules them they are crossed out and replaced.</span></div>
  <div id="final">
    <div class="lbl">final transcript <button id="copy" class="mini">copy</button></div>
    <div id="finaltext"></div>
  </div>
  <div id="log"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const out = $('#out'), logEl = $('#log'), recBtn = $('#rec'), dot = $('#dot');
let ws=null, ctx=null, node=null, stream=null, recording=false, provSpan=null, started=false;

// Trained operating points come from the SERVER, per arm. The two checkpoints
// were trained on different chunk sets, and decoding at a size a model never
// saw still produces fluent text -- which is the dangerous failure mode, so
// these are never free-form inputs and never a list hard-coded here.
let INFO = null;
function fill(sel, vals, def){ sel.innerHTML=''; vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;if(v===def)o.selected=true;sel.appendChild(o);}); }
function nearest(vals, want){ return vals.includes(want) ? want : vals[vals.length-1]; }

const INTRO = {
  script: 'Press Record and speak. Provisional words appear greyed; when the slow front '
        + 'overrules them they are crossed out and replaced.',
  interleaved: 'Press Record and speak. The interleaved baseline decodes live, one front only: '
        + 'each chunk appears as the decode commits it and is never revised, so nothing here is ever '
        + 'crossed out.'
};

function applyArm(){
  const arm = $('#arm').value;
  $('#scriptctl').hidden = arm !== 'script';
  $('#ilctl').hidden = arm !== 'interleaved';
  const i = $('#intro');   // gone once a transcript has replaced it
  if(i) i.textContent = INTRO[arm];
}

fetch('/info').then(r=>r.json()).then(j=>{
  INFO = j;
  fill($('#fast'), j.script.chunks, nearest(j.script.chunks,2));
  fill($('#slow'), j.script.chunks, nearest(j.script.chunks,28));
  fill($('#fdelay'), j.script.delays, nearest(j.script.delays,1));
  fill($('#sdelay'), j.script.delays, nearest(j.script.delays,3));
  // The model picker only appears when a SECOND arm is actually loaded. With
  // one arm there is nothing to pick, and a disabled dropdown is just clutter
  // in a demo recording.
  const il = $('#arm').querySelector('option[value=interleaved]');
  if(!j.interleaved){
    il.disabled = true;
    $('#arm').value = 'script';
  } else {
    $('#armsel').hidden = false;
    // Only name the second arm in the heading when it is actually loaded, so a
    // SCRIPT-only server reads as a SCRIPT demo.
    $('#htitle').textContent = 'streaming ASR — SCRIPT vs interleaved';
    document.title = 'SCRIPT vs interleaved — streaming ASR';
    fill($('#ilchunk'), j.interleaved.chunks, nearest(j.interleaved.chunks,14));
    fill($('#ildelay'), j.interleaved.delays, nearest(j.interleaved.delays,0));
  }
  applyArm();
}).catch(e=>log('could not read /info: '+e.message));
$('#arm').onchange = applyArm;

function log(t){ logEl.textContent += t + "\n"; }

// Device labels are hidden until the user has granted mic permission at least
// once, so the list starts as "default" and is refilled after the first Record.
async function listMics(){
  try{
    const devs = await navigator.mediaDevices.enumerateDevices();
    const ins = devs.filter(d=>d.kind==='audioinput');
    const sel = $('#mic'), cur = sel.value;
    sel.innerHTML = '<option value="">default</option>';
    ins.forEach((d,i)=>{
      const o=document.createElement('option');
      o.value=d.deviceId;
      o.textContent=d.label || `microphone ${i+1}`;
      sel.appendChild(o);
    });
    if([...sel.options].some(o=>o.value===cur)) sel.value=cur;
  }catch(e){ log('could not list microphones: '+e.message); }
}
listMics();
if(navigator.mediaDevices && navigator.mediaDevices.addEventListener)
  navigator.mediaDevices.addEventListener('devicechange', listMics);
function clearOut(){ out.textContent=''; provSpan=null; $('#final').style.display='none'; logEl.textContent=''; }

function setProv(text){
  if(!provSpan){ provSpan=document.createElement('span'); provSpan.className='prov'; out.appendChild(provSpan); }
  // Measure the COMMITTED text only. out.textContent includes the provisional
  // span itself, so testing it directly made the leading space appear on the
  // first paint and vanish on every repaint after it.
  const committedLen = out.textContent.length - provSpan.textContent.length;
  provSpan.textContent = text ? (committedLen ? ' ' : '') + text : '';
}
function commit(segs){
  if(provSpan){ provSpan.remove(); provSpan=null; }
  for(const [text,struck] of segs){
    const sp=document.createElement('span');
    if(struck) sp.className='struck';
    sp.textContent=(out.textContent.length? ' ':'')+text;
    out.appendChild(sp);
  }
  window.scrollTo(0,document.body.scrollHeight);
}

async function start(){
  clearOut(); started=false;
  const micId = $('#mic').value;
  const audioCfg = {channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true};
  if(micId) audioCfg.deviceId = {exact: micId};
  stream = await navigator.mediaDevices.getUserMedia({audio: audioCfg});
  listMics();   // labels become readable once permission has been granted
  const track = stream.getAudioTracks()[0];
  if(track) log('mic: ' + (track.label || 'unnamed'));
  // Ask for 16 kHz directly where supported; otherwise resample below.
  ctx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
  const src = ctx.createMediaStreamSource(stream);
  node = ctx.createScriptProcessor(2048,1,1);
  const proto = location.protocol==='https:'?'wss':'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType='arraybuffer';
  ws.onopen = ()=>{
    ws.send(JSON.stringify({model:$('#arm').value,
                            fast:+$('#fast').value, slow:+$('#slow').value,
                            fast_delay:+$('#fdelay').value, slow_delay:+$('#sdelay').value,
                            il_chunk:+$('#ilchunk').value, il_delay:+$('#ildelay').value,
                            prompt_extra:$('#prompt_extra').value}));
    src.connect(node); node.connect(ctx.destination);
  };
  ws.onmessage = e=>{
    const m = JSON.parse(e.data);
    if(m.t==='prov') setProv(m.text);
    else if(m.t==='commit') commit(m.segs);
    else if(m.t==='log') log(m.text);
    else if(m.t==='final'){
      $('#final').style.display='block';
      $('#finaltext').textContent = m.text;
      log(`[audio] ${m.audio_s}s, ${m.blocks} blocks`);
      if(m.timed_out) log('[server] ended on silence');
      if(m.diag) log(m.diag);
      if(!m.ok) log('[hint] the transcript is probably wrong because of the AUDIO, not the model');
    }
    else if(m.t==='done') stop(true);
  };
  node.onaudioprocess = ev=>{
    if(!recording || !ws || ws.readyState!==1) return;
    const f = ev.inputBuffer.getChannelData(0);
    const need = ctx.sampleRate===16000 ? f : resample(f, ctx.sampleRate, 16000);
    const pcm = new Int16Array(need.length);
    for(let i=0;i<need.length;i++){ const s=Math.max(-1,Math.min(1,need[i])); pcm[i]=s<0?s*0x8000:s*0x7fff; }
    ws.send(pcm.buffer);
  };
  recording=true; started=true;
  recBtn.textContent='Stop'; recBtn.classList.add('rec'); dot.classList.add('on');
}

// Linear resample: only used when the browser refuses a 16 kHz AudioContext
// (Safari). Good enough for speech and avoids pulling in a library.
function resample(buf, from, to){
  const ratio=from/to, n=Math.floor(buf.length/ratio), o=new Float32Array(n);
  for(let i=0;i<n;i++){ const p=i*ratio, j=Math.floor(p), f=p-j;
    o[i]=buf[j]*(1-f)+(buf[Math.min(j+1,buf.length-1)])*f; }
  return o;
}

function stop(fromServer){
  recording=false;
  recBtn.textContent='Record'; recBtn.classList.remove('rec'); dot.classList.remove('on');
  try{ if(node){node.disconnect(); node.onaudioprocess=null;} }catch(e){}
  try{ if(stream) stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ if(ctx) ctx.close(); }catch(e){}
  if(!fromServer && ws && ws.readyState===1) ws.send(JSON.stringify({t:'stop'}));
  node=null; stream=null; ctx=null;
}

$('#copy').onclick = ()=>{
  navigator.clipboard.writeText($('#finaltext').textContent.trim())
    .then(()=>{ const b=$('#copy'); b.textContent='copied'; setTimeout(()=>b.textContent='copy',1200); });
};
recBtn.onclick = ()=>{ if(recording) stop(false); else start().catch(e=>{ log('mic error: '+e.message); stop(false); }); };
document.addEventListener('keydown', e=>{ if(e.code==='Space' && e.target===document.body){ e.preventDefault(); recBtn.click(); }});
</script>
</body>
</html>
