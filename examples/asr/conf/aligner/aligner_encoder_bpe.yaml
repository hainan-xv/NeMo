# Configuration for the Aligner-Encoder ASR model (sub-word / BPE), based on:
#   Stooke et al., "Aligner-Encoders: Self-Attention Transformers Can Be Self-Transducers"
#   https://arxiv.org/abs/2502.05232
#
# The Aligner-Encoder reuses a Conformer encoder and an RNN-T prediction network, but:
#   * the joint network pairs encoder frame i with prediction-net step i one-to-one
#     (the diagonal of the RNN-T lattice) -- there is no blank token;
#   * training uses a frame-wise label-smoothed cross-entropy loss (no dynamic programming);
#   * an EOS token is appended to every target and predicted to terminate decoding.
#
# Set `model.aligner_type` to:
#   * "ar"    -> autoregressive decoder (prediction net + one-to-one joint). [default]
#   * "nonar" -> non-autoregressive per-frame head f_ind(h_i) (CTC-like, no prediction net).
#
# For the autoregressive model you may also set `model.aux_nonar_loss_weight > 0` to add an
# auxiliary non-autoregressive cross-entropy loss (analogous to a CTC auxiliary loss).

name: "Aligner-Encoder-BPE"

# Optional warm-start from a base TDT/RNN-T model. When set, the entrypoint
# derives the preprocessor / encoder / spec_augment sub-configs and the BPE
# tokenizer from this model and warm-starts the encoder weights from it. The
# Aligner prediction net / one-to-one joint / loss are always trained from scratch.
base_model_path: null            # e.g. /pretrained/parakeet-tdt-0.6b-v2.nemo
base_model_name: null            # e.g. nvidia/parakeet-tdt-0.6b-v2
init_encoder_from_base: true     # encoder-only warm start (only if a base model is given)
tokenizer_out_dir: null          # where to export the base tokenizer (default: temp dir)

model:
  sample_rate: 16000
  compute_eval_loss: true
  log_prediction: true
  skip_nan_grad: false

  # Aligner-Encoder specific options
  aligner_type: "ar"          # "ar" or "nonar"
  label_smoothing: 0.1        # label smoothing weight for the cross-entropy loss
  aux_nonar_loss_weight: 0.0  # >0 adds an auxiliary non-AR loss to the AR model

  model_defaults:
    enc_hidden: ${model.encoder.d_model}
    pred_hidden: 640
    joint_hidden: 640

  train_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: true
    num_workers: 8
    pin_memory: true
    max_duration: 16.7
    min_duration: 0.1
    is_tarred: false
    tarred_audio_filepaths: null
    shuffle_n: 2048
    bucketing_strategy: "synced_randomized"
    bucketing_batch_size: null

  validation_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 8
    pin_memory: true

  test_ds:
    manifest_filepath: null
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 8
    pin_memory: true

  # recommend to use SPE Unigram tokenizer with vocab size of 1K to 4k when using 4x sub-sampling
  tokenizer:
    dir: ???  # path to directory which contains either tokenizer.model (bpe) or vocab.txt (for wpe)
    type: bpe  # Can be either bpe (SentencePiece tokenizer) or wpe (WordPiece tokenizer)

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: ${model.sample_rate}
    normalize: "per_feature"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 80
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001
    pad_to: 0

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05

  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: ${model.preprocessor.features}
    feat_out: -1
    n_layers: 17
    d_model: 512

    # Sub-sampling parameters
    subsampling: striding
    subsampling_factor: 4
    subsampling_conv_channels: -1
    causal_downsampling: false

    reduction: null
    reduction_position: null
    reduction_factor: 1

    ff_expansion_factor: 4

    self_attention_model: rel_pos
    n_heads: 8
    att_context_size: [-1, -1]
    att_context_style: regular
    xscaling: true
    untie_biases: true
    pos_emb_max_len: 5000

    conv_kernel_size: 31
    conv_norm_type: 'batch_norm'
    conv_context_size: null

    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1

    stochastic_depth_drop_prob: 0.0
    stochastic_depth_mode: linear
    stochastic_depth_start_layer: 1

  # Prediction network (text-only recurrence). Used by the autoregressive variant.
  decoder:
    _target_: nemo.collections.asr.modules.RNNTDecoder
    normalization_mode: null
    random_state_sampling: false
    blank_as_pad: true

    prednet:
      pred_hidden: ${model.model_defaults.pred_hidden}
      pred_rnn_layers: 1
      t_max: null
      dropout: 0.2

  # One-to-one joint network. NOTE: this is the Aligner joint, not the RNN-T joint.
  joint:
    _target_: nemo.collections.asr.modules.AlignerJoint
    log_softmax: null

    jointnet:
      joint_hidden: ${model.model_defaults.joint_hidden}
      activation: "relu"
      dropout: 0.2

  # Per-frame head for the non-autoregressive variant (also used when aux_nonar_loss_weight > 0).
  ctc_head:
    hidden: null       # null -> single linear projection; set an int for a 2-layer MLP
    activation: "relu"
    dropout: 0.0

  decoding:
    aligner_type: ${model.aligner_type}
    max_symbols: null  # null -> bounded by the number of encoder frames

  optim:
    name: adamw
    lr: 5.0
    betas: [0.9, 0.98]
    weight_decay: 1e-3

    sched:
      name: NoamAnnealing
      d_model: ${model.encoder.d_model}
      warmup_steps: 10000
      warmup_ratio: null
      min_lr: 1e-6

trainer:
  devices: -1
  num_nodes: 1
  max_epochs: 500
  max_steps: -1
  val_check_interval: 1.0
  accelerator: auto
  strategy: ddp
  accumulate_grad_batches: 1
  gradient_clip_val: 0.0
  precision: 32
  log_every_n_steps: 10
  enable_progress_bar: True
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  sync_batchnorm: true
  enable_checkpointing: False
  logger: false
  benchmark: false

exp_manager:
  exp_dir: null
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 5
    always_save_nemo: True
  resume_from_checkpoint: null
  resume_if_exists: false
  resume_ignore_no_checkpoint: false

  create_wandb_logger: false
  wandb_logger_kwargs:
    name: null
    project: null
