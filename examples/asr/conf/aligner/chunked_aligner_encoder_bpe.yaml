# Configuration for the streaming Chunked-Aligner ASR model (sub-word / BPE).
#
# Motivation: the offline Aligner-Encoder (Stooke et al., 2025) self-transduces a
# full utterance with attention. The Chunked Aligner makes this streaming-friendly
# by constraining alignment to fixed-size encoder chunks, and -- unlike
# "Chunkwise Aligners for Streaming Speech Recognition", which needs external
# timestamps -- learns the chunk-level alignment from scratch with a full-sum
# (forward-backward) objective, analogous to RNN-T/CTC.
#
# Topology (one chunk = `chunk_size` encoder frames):
#   * the model reuses a standard RNN-T prediction net + joint (blank included);
#   * within a chunk the diagonal advances one frame per emitted token;
#   * the blank doubles as an end-of-chunk (EOC) signal -> jump to the next chunk;
#   * the loss sums probability over all valid chunked alignment paths
#     (`ChunkedAlignerLossNumba`) and decoding replays the lattice greedily.
#
# Like the offline Aligner recipe this can be warm-started (encoder-only) from a
# pretrained TDT/RNN-T model via `base_model_name` / `base_model_path`.

name: "Chunked-Aligner-Encoder-BPE"

# Optional warm-start from a base TDT/RNN-T model. When set, the entrypoint
# derives the preprocessor / encoder / spec_augment sub-configs and the BPE
# tokenizer from this model and warm-starts the encoder weights from it. The
# Chunked-Aligner prediction net / joint / loss are always trained from scratch.
base_model_path: null            # e.g. /pretrained/parakeet-tdt-0.6b-v2.nemo
base_model_name: null            # e.g. nvidia/parakeet-tdt-0.6b-v2
init_encoder_from_base: true     # encoder-only warm start (only if a base model is given)
tokenizer_out_dir: null          # where to export the base tokenizer (default: temp dir)

# Overrides merged INTO the encoder config AFTER the base-model encoder is injected.
# The base injection replaces cfg.model.encoder wholesale, so plain `model.encoder.*`
# CLI overrides are clobbered for warm-start runs -- use this instead. Example: pin a
# single fixed cache-aware streaming chunk in place of a multi-lookahead base model:
#   ++encoder_overrides.att_context_size=[70,13]
encoder_overrides: null

model:
  sample_rate: 16000
  compute_eval_loss: true
  log_prediction: true
  skip_nan_grad: false

  # Chunked-Aligner specific options
  loss_type: "chunked_aligner"  # default RNNT path remains "rnnt"; this enables the chunked-aligner loss/decoding
  chunked_aligner:
    chunk_size: 12              # number of encoder frames per chunk
    clamp: -1.0                 # >=0 clamps loss grads to [-clamp, clamp]
    # Non-autoregressive mode: drop the prediction net + joint and replace them with
    # a single per-frame projection head (applied after token extraction). Removes
    # the U-axis from the activations -> large training-memory win. (Loss WIP.)
    nar: false
    # 'mean_volume' = per-token NLL (~ln V at init, comparable to CE / TDT scale, so
    # the shared LR transfers). 'mean' = total-sequence NLL averaged over the batch.
    reduction: mean_volume
    # Optional learned token-extraction layer at the end of the encoder. -1 = off.
    # When >=1, each acoustic chunk of `chunk_size` encoder frames is compressed into
    # `token_extraction_size` learned tokens via cross-attention (trainable query bank
    # + Q/K/V/output projections), and the Chunked-Aligner lattice runs over those
    # tokens (effective chunk_size = token_extraction_size, the max #tokens/chunk).
    token_extraction_size: -1
    # Cheap alternative to token_extraction_size. -1 = off. When >=1, keep only
    # the first k encoder frames in each acoustic chunk before the joint/loss, so
    # each chunk can emit at most k tokens without adding a learned extractor.
    # Mutually exclusive with token_extraction_size.
    first_k_frames_per_chunk: -1
    # Learned per-chunk query embedding combined with the first-k method (requires
    # first_k_frames_per_chunk >= 1). When true, a trainable [chunk_size, d_model]
    # tensor is tiled over time and added to the INPUT of the last conformer layer
    # (on top of the second-to-last layer output, before its self-attention); the
    # first-k selection then truncates each chunk to its first k frames for the
    # logits/loss. Zero-initialized -> identical to plain first-k at init.
    chunk_query: false
    # Reshape + channel-axis attention token mixer (requires first_k_frames_per_chunk
    # >= 1, which doubles as the number of tokens/chunk M; mutually exclusive with
    # token_extraction_size and chunk_query). When true, each [chunk_size, d_model]
    # chunk is reshaped to [chunk_size*d_model/M, M], self-attended over the M (token)
    # axis, and the M rows become the per-chunk tokens. The lattice then runs with
    # chunk_size = M and the joint/head see encoder-out dim chunk_size*d_model/M.
    chunk_channel_attn: false
    chunk_channel_attn_heads: 4   # attention heads over the M-token axis (coerced to a divisor of new_d_model)
  log_stats_every_n_steps: 20        # rank-0 stdout [chunked_aligner-train] summary (<=0 disables)
  log_prediction_every_n_steps: 100  # rank-0 stdout hyp/ref samples (<=0 disables)
  log_prediction_num_samples: 2

  model_defaults:
    enc_hidden: ${model.encoder.d_model}
    pred_hidden: 640
    joint_hidden: 640

  train_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: true
    num_workers: 8
    pin_memory: true
    max_duration: 16.7
    min_duration: 0.1
    is_tarred: false
    tarred_audio_filepaths: null
    shuffle_n: 2048
    bucketing_strategy: "synced_randomized"
    bucketing_batch_size: null

  validation_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 8
    pin_memory: true

  test_ds:
    manifest_filepath: null
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 8
    pin_memory: true

  # recommend to use SPE Unigram tokenizer with vocab size of 1K to 4k when using 4x sub-sampling
  tokenizer:
    dir: ???  # path to directory which contains either tokenizer.model (bpe) or vocab.txt (for wpe)
    type: bpe  # Can be either bpe (SentencePiece tokenizer) or wpe (WordPiece tokenizer)

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: ${model.sample_rate}
    normalize: "per_feature"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 80
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001
    pad_to: 0

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05

  # FastConformer-large (~110M params). Identical to the encoder used by the
  # comparable TDT recipe so the models differ only in the decoder/loss. The
  # chunked lattice needs at least T >= U (encoder frames >= target tokens); with
  # 8x sub-sampling (80ms frames) this holds comfortably for <=20s utterances.
  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: ${model.preprocessor.features}
    feat_out: -1
    n_layers: 17
    d_model: 512

    # Sub-sampling parameters (FastConformer: 8x depthwise-striding).
    subsampling: dw_striding
    subsampling_factor: 8
    subsampling_conv_channels: 256
    causal_downsampling: false

    reduction: null
    reduction_position: null
    reduction_factor: 1

    ff_expansion_factor: 4

    self_attention_model: rel_pos
    n_heads: 8
    att_context_size: [-1, -1]
    att_context_style: regular
    xscaling: true
    untie_biases: true
    pos_emb_max_len: 5000

    conv_kernel_size: 9
    conv_norm_type: 'batch_norm'
    conv_context_size: null

    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1

    stochastic_depth_drop_prob: 0.0
    stochastic_depth_mode: linear
    stochastic_depth_start_layer: 1

  # Standard RNN-T prediction network (text-only recurrence).
  decoder:
    _target_: nemo.collections.asr.modules.RNNTDecoder
    normalization_mode: null
    random_state_sampling: false
    blank_as_pad: true

    prednet:
      pred_hidden: ${model.model_defaults.pred_hidden}
      pred_rnn_layers: 1
      t_max: null
      dropout: 0.2

  # Standard RNN-T joint (output space includes the blank/EOC). NOTE: fused
  # loss/WER must stay OFF -- the Chunked Aligner uses its own loss + decoding.
  joint:
    _target_: nemo.collections.asr.modules.RNNTJoint
    log_softmax: null
    preserve_memory: false
    fuse_loss_wer: false

    jointnet:
      joint_hidden: ${model.model_defaults.joint_hidden}
      activation: "relu"
      dropout: 0.2

  decoding:
    max_symbols: null  # null -> bounded by the number of encoder frames

  optim:
    name: adamw
    # NOTE: with CosineAnnealing, `lr` is the actual peak LR.
    lr: 1e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3

    sched:
      name: CosineAnnealing
      warmup_steps: 10000
      warmup_ratio: null
      min_lr: 1e-6

trainer:
  devices: -1
  num_nodes: 1
  max_epochs: 500
  max_steps: -1
  val_check_interval: 1.0
  accelerator: auto
  strategy: ddp
  accumulate_grad_batches: 1
  gradient_clip_val: 0.0
  precision: 32
  log_every_n_steps: 10
  enable_progress_bar: True
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  sync_batchnorm: true
  enable_checkpointing: False
  logger: false
  benchmark: false

exp_manager:
  exp_dir: null
  name: ${name}
  create_tensorboard_logger: false
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 5
    always_save_nemo: True
  resume_from_checkpoint: null
  resume_if_exists: false
  resume_ignore_no_checkpoint: false

  create_wandb_logger: false
  wandb_logger_kwargs:
    name: null
    project: null
