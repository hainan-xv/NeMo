# Local (single-node, multi-GPU) Aligner-Encoder BPE config for a quick LibriSpeech
# smoke / overfit run. Compared to aligner_encoder_bpe.yaml this:
#   * uses a much smaller Conformer encoder (trains fast on a couple of GPUs),
#   * reads plain NeMo JSON manifests (no lhotse / tarred data),
#   * trains the model FROM SCRATCH (no parakeet warm start), and
#   * uses a short CosineAnnealing warmup suitable for a small run.
#
# Paths (tokenizer dir + manifests) are filled in by local_librispeech_aligner.sh.

name: "Aligner-Encoder-BPE-Local"

# No base-model warm start for the local run (train everything from scratch).
base_model_path: null
base_model_name: null
init_encoder_from_base: false
tokenizer_out_dir: null

model:
  sample_rate: 16000
  compute_eval_loss: true
  log_prediction: true
  skip_nan_grad: true

  # RNNT-native Aligner-Encoder mode.
  loss_type: "aligner"
  aligner_type: "ar"          # "ar" or "nonar"
  label_smoothing: 0.1
  aux_nonar_loss_weight: 0.0
  log_stats_every_n_steps: 10  # rank-0 stdout summary for W&B-delay debugging (<=0 disables)

  model_defaults:
    enc_hidden: ${model.encoder.d_model}
    pred_hidden: 320
    joint_hidden: 320

  train_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    batch_size: 8
    shuffle: true
    num_workers: 4
    pin_memory: true
    max_duration: 20.0
    min_duration: 0.1
    is_tarred: false
    tarred_audio_filepaths: null

  validation_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    batch_size: 8
    shuffle: false
    use_start_end_token: false
    num_workers: 4
    pin_memory: true

  test_ds:
    manifest_filepath: null
    sample_rate: ${model.sample_rate}
    batch_size: 8
    shuffle: false
    use_start_end_token: false
    num_workers: 4
    pin_memory: true

  tokenizer:
    dir: ???   # filled by the launch script (built with process_asr_text_tokenizer.py)
    type: bpe

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: ${model.sample_rate}
    normalize: "per_feature"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 80
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001
    pad_to: 0

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 5
    freq_width: 27
    time_width: 0.05

  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: ${model.preprocessor.features}
    feat_out: -1
    n_layers: 8
    d_model: 256

    subsampling: striding
    subsampling_factor: 4
    subsampling_conv_channels: -1
    causal_downsampling: false

    reduction: null
    reduction_position: null
    reduction_factor: 1

    ff_expansion_factor: 4

    self_attention_model: rel_pos
    n_heads: 4
    att_context_size: [-1, -1]
    att_context_style: regular
    xscaling: true
    untie_biases: true
    pos_emb_max_len: 5000

    conv_kernel_size: 31
    conv_norm_type: 'batch_norm'
    conv_context_size: null

    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1

    stochastic_depth_drop_prob: 0.0
    stochastic_depth_mode: linear
    stochastic_depth_start_layer: 1

  decoder:
    _target_: nemo.collections.asr.modules.RNNTDecoder
    normalization_mode: null
    random_state_sampling: false
    blank_as_pad: true

    prednet:
      pred_hidden: ${model.model_defaults.pred_hidden}
      pred_rnn_layers: 1
      t_max: null
      dropout: 0.2

  joint:
    _target_: nemo.collections.asr.modules.AlignerJoint
    log_softmax: null

    jointnet:
      joint_hidden: ${model.model_defaults.joint_hidden}
      activation: "relu"
      dropout: 0.2

  ctc_head:
    hidden: null
    activation: "relu"
    dropout: 0.0

  decoding:
    aligner_type: ${model.aligner_type}
    max_symbols: null

  optim:
    name: adamw
    lr: 3e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3

    sched:
      name: CosineAnnealing
      warmup_steps: 200
      warmup_ratio: null
      min_lr: 1e-6

trainer:
  devices: 2
  num_nodes: 1
  max_steps: 2000
  max_epochs: -1
  val_check_interval: 200
  limit_val_batches: 20
  accelerator: gpu
  strategy: ddp_find_unused_parameters_true
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: 32
  log_every_n_steps: 5
  enable_progress_bar: true
  num_sanity_val_steps: 0
  check_val_every_n_epoch: null
  sync_batchnorm: true
  benchmark: false
  # exp_manager attaches the loggers; Lightning must not create its own.
  logger: false
  enable_checkpointing: false

exp_manager:
  exp_dir: ./nemo_experiments_aligner_local
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 1
    always_save_nemo: false
  resume_if_exists: false
  resume_ignore_no_checkpoint: true
  # WandB off by default; the launch script can flip it on (great local check of
  # whether the logging path itself works, independent of the cluster network).
  create_wandb_logger: false
  wandb_logger_kwargs:
    name: null
    project: null
