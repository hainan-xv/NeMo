# CHAT transducer on Granary 2.0 -- BOTH training objectives.
#
# One config, one architecture, one vocabulary; `model.loss_type` selects whether
# the run marginalises over every alignment (the ordinary RNN-T loss) or
# conditions on a single forced alignment. Because the two arms differ in that
# field alone, the gap between them is exactly the cost (or benefit) of fixing
# the alignment, and a checkpoint from either can initialise the other.
#
# The encoder block is copied verbatim from the donor's own model_config so
# init_from_nemo_model can load its weights -- any mismatch in d_model, n_layers,
# subsampling or conv settings silently drops those tensors and leaves a
# randomly initialised encoder.
#
# Chunk size is auto-inferred by rnnt_models.py from att_context_size as
# right_context + 1 = 14, matching the forced-alignment runs.

name: "Nemotron-CHAT-Transducer-Granary2"

model:
  sample_rate: 16000
  compute_eval_loss: false
  log_prediction: true
  skip_nan_grad: false

  # Sum the losses and divide by the total number of TARGET TOKENS, rather than
  # by batch size (NeMo's default mean_batch).
  #
  # This is what makes the loss comparable to the forced-alignment arm, which
  # uses F.cross_entropy over path steps -- i.e. already per-token. Under
  # mean_batch a long utterance contributes the same as a short one, so the two
  # runs' loss curves would be on different scales and the per-token difficulty
  # would be hidden behind the batch's length mix.
  rnnt_reduction: mean_volume

  # THE ONE KNOB THAT SEPARATES THE TWO ARMS.
  #
  #   rnnt             -- the ordinary transducer loss, marginalising over every
  #                       alignment. Needs a [B, T, U, V+1] tensor.
  #   forced_alignment -- cross-entropy along ONE path, taken from the word
  #                       timings the Granary cuts carry. Scores U+T positions
  #                       instead of T*U, which is what makes a large vocabulary
  #                       affordable.
  #   banded           -- the middle ground: sum over every path that stays
  #                       within forced_alignment.band_chunks chunks of the
  #                       aligner's, so the alignment is a prior rather than a
  #                       constraint. About 2.2x the forced cost at band 1, and
  #                       an order of magnitude below full marginalisation.
  #
  # Everything else -- architecture, vocabulary, data, decoding -- is shared, so
  # a difference between the two runs is a difference in the objective alone.
  loss_type: rnnt

  forced_alignment:
    # Emit a word at the chunk containing its last frame PLUS this delay. A
    # word's final frames are often what disambiguate it, so emitting at the
    # chunk where it ends leaves the encoder no right context. 3 is what the
    # speechlm2 recipe this was ported from used; 0 measurably slows convergence.
    #
    # Pairs with the 0.5 s tail padding below, which gives a delayed final word
    # real audio to be emitted against. Without it the delay still resolves --
    # a word pushed past the last chunk is folded back into it, which measurably
    # only bites when the encoder length lands on an exact chunk boundary -- but
    # the tail no longer matches the padded audio used at eval time.
    num_delay_frames: 3
    # Additionally score each chunk on the previous chunk's last k words,
    # starting from the prefix before them. Nothing is removed from the output;
    # it teaches the model to recover when its history is short, which is what
    # makes retract-style decoding legal at inference.
    recover_history_words: 0
    # FLEXIBLE DELAY. 0 disables (fixed num_delay_frames above). When > 0, each
    # batch draws d ~ U{0..max_delay_frames} and the joint additionally hides the
    # last d frames of every chunk, so the model emits a chunk's words from
    # exactly the audio that has arrived. d is therefore a LATENCY knob -- at d
    # the model commits d frames before the chunk completes -- and training over
    # the range gives one model usable at any latency in it.
    #
    # Needs joint.history_chunks >= 1: frames are being taken away, so the window
    # must reach back a chunk to keep enough to attend to.
    max_delay_frames: 0
    # Latency to validate and decode at; defaults to half the range.
    inference_delay_frames: null
    # Chunks a word may drift from where the aligner put it, for loss_type
    # "banded". 0 reproduces the forced loss exactly (one surviving path), and a
    # value >= the chunk count reproduces the full RNN-T loss -- both asserted in
    # tests/collections/asr/test_banded_rnnt.py.
    band_chunks: 1
    # Seconds per ENCODER frame; defaults to window_stride * subsampling_factor.
    frame_length_in_secs: null

  model_defaults:
    enc_hidden: 1024
    pred_hidden: 640
    joint_hidden: 640

  train_ds:
    use_lhotse: true
    # The same filtered Granary 2.0 the forced-alignment arms train on. Those
    # need the word alignments this manifest carries; the standard RNN-T loss
    # does not, but pointing at the same data is what makes the comparison a
    # comparison.
    input_cfg: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_speechlm/users/dongjig/aligned_amos/granary_v2_en_pnc_qwen_aligned_filtered/granary_v2_en_pnc_qwen_aligned_filtered_safe_iad_s3_audio.yaml
    manifest_filepath: null
    skip_missing_manifest_entries: true
    sample_rate: ${model.sample_rate}
    shuffle: true
    shard_seed: "randomized"
    num_workers: 8
    pin_memory: true
    force_iterable_dataset: true
    # Same bucketing as the forced-alignment arms, so a step covers a comparable
    # amount of audio and the two runs are step-for-step meaningful.
    use_bucketing: true
    bucket_duration_bins: [4.32, 6.0, 7.04, 7.92, 8.8, 9.6, 10.4, 11.12, 11.89, 12.66, 13.47, 14.8, 16.92, 20.0, 22.4, 29.44, 35.0, 39.6]
    bucket_batch_size: [38, 29, 25, 22, 20, 18, 17, 15, 14, 13, 12, 11, 10, 8, 7, 6, 5, 4]
    max_duration: 54
    min_duration: 0.1
    seed: 42
    # Pad 0.5 s of silence onto every clip, as the speechlm2 recipes do and as
    # the leaderboard eval does (--pad_extra_seconds 0.5). Without it the
    # emission delay has no frames to land in at the end of an utterance.
    pad_extra_duration: 0.5
    pad_extra_duration_prob: 1.0

    # text_field deliberately UNSET, matching the speechlm2 recipes that read
    # this same input_cfg. Setting it to "answer" made every TRAINING target
    # empty: the granary cuts carry their transcript in the default field, so
    # the lookup found nothing, the RNN-T loss was trivially satisfied by
    # emitting blanks (loss -> 0 within a few steps) and training WER was NaN
    # from dividing by zero reference words. Validation was unaffected because
    # its JSON manifest happens to have BOTH "text" and "answer" keys, which is
    # exactly what made the bug asymmetric and easy to miss.

  validation_ds:
    use_lhotse: true
    # The identical validation set the SCRIPT and forced-alignment CHAT runs use,
    # so val_wer is comparable across all three.
    manifest_filepath: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_speechlm/users/dongjig/aligned_amos/steve_val_mmlpc_mcv11_2k/mcv11_dev_clean_pcstrip_en_2k_qwen_aligned.json
    sample_rate: ${model.sample_rate}
    # Padded like training and like the leaderboard eval, so val_wer is measured
    # on the same audio shape the model is trained and evaluated on.
    pad_extra_duration: 0.5
    pad_extra_duration_prob: 1.0
    batch_size: 8
    shuffle: false
    num_workers: 4
    pin_memory: true

  test_ds:
    manifest_filepath: null
    sample_rate: ${model.sample_rate}
    batch_size: 8
    shuffle: false
    num_workers: 4

  tokenizer:
    # The donor's own 1,024-piece SentencePiece model, extracted from the .nemo.
    # Must be the SAME vocabulary the 1k forced-alignment arm uses or the two are
    # not comparable.
    dir: ???
    type: bpe

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: ${model.sample_rate}
    normalize: "per_feature"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 128
    n_fft: 512
    log: true
    frame_splicing: 1
    dither: 0.00001
    pad_to: 0
    pad_value: 0.0

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05

  # --- copied verbatim from the donor's model_config so its weights load ---
  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: ${model.preprocessor.features}
    feat_out: -1
    n_layers: 24
    d_model: 1024
    subsampling: dw_striding
    subsampling_factor: 8
    subsampling_conv_channels: 256
    causal_downsampling: true
    ff_expansion_factor: 4
    self_attention_model: rel_pos
    n_heads: 8
    # Single context, not the donor's four: the forced-alignment arms are pinned
    # to [70, 13] and the joint infers chunk_size = right + 1 = 14 from it. A
    # list would make chunk_size ambiguous and rnnt_models.py rejects it.
    att_context_size: [70, 13]
    att_context_style: chunked_limited
    xscaling: true
    untie_biases: true
    pos_emb_max_len: 5000
    conv_kernel_size: 9
    conv_norm_type: layer_norm
    conv_context_size: causal
    use_bias: false
    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1

  decoder:
    _target_: nemo.collections.asr.modules.RNNTDecoder
    normalization_mode: null
    random_state_sampling: false
    blank_as_pad: true
    prednet:
      pred_hidden: ${model.model_defaults.pred_hidden}
      pred_rnn_layers: 2
      t_max: null
      # 0.1, as the speechlm2 CHAT model used -- not the 0.2 the standard ASR
      # transducer recipes carry. The prediction network and joint are trained
      # from SCRATCH here; doubling their dropout slows convergence for no gain
      # this early, and this recipe already regularises with SpecAugment.
      dropout: 0.1

  joint:
    _target_: nemo.collections.asr.modules.RNNTAttJoint
    log_softmax: null
    # Widen the joint's cross-attention keys/values to also cover the previous M
    # chunks ("win28" at M=1). Applied at the CHUNKING step and strictly
    # backward-looking, so it adds context without adding latency. Independent of
    # loss_type -- both arms may use it.
    history_chunks: 0
    preserve_memory: false
    fuse_loss_wer: false
    fused_batch_size: null
    jointnet:
      # 1024 straight from the encoder -- the joint does the projection itself,
      # as the donor did, with no intermediate bottleneck.
      encoder_hidden: ${model.model_defaults.enc_hidden}
      pred_hidden: ${model.model_defaults.pred_hidden}
      joint_hidden: ${model.model_defaults.joint_hidden}
      activation: "relu"
      dropout: 0.1  # matches the speechlm2 CHAT model; see prednet above

  decoding:
    strategy: "greedy_batch"
    greedy:
      max_symbols: 10
    beam:
      beam_size: 2
      return_best_hypothesis: false
      score_norm: true
      tsd_max_sym_exp: 50
      alsd_max_target_len: 2.0

  loss:
    loss_name: "default"
    warprnnt_numba_kwargs:
      fastemit_lambda: 0.005
      clamp: -1.0

  # ONE learning rate for every parameter, the pretrained encoder included.
  # An earlier version held the encoder at 0.1x on the argument that a
  # pretrained component only needs fine-tuning. That is an extra moving part
  # with no measurement behind it here, and it made the effective schedule
  # depend on a regex over parameter names.
  optim:
    name: adamw
    lr: 1e-3
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    sched:
      name: CosineAnnealing
      warmup_steps: 2500
      warmup_ratio: null
      min_lr: 1e-6

trainer:
  devices: -1
  num_nodes: 1
  max_epochs: -1
  max_steps: 300000
  val_check_interval: 4000
  limit_train_batches: 4000
  accelerator: gpu
  # Lhotse samplers shard the data themselves and expose no __len__, so Lightning
  # must not wrap them: with the default (true) it substitutes a
  # DistributedSamplerWrapper and dies at dataloader setup. This config was
  # adapted from the ASR-side CHAT recipe, which does not use Lhotse and so never
  # needed the flag; every speechlm2 recipe reading this manifest sets it.
  use_distributed_sampler: false
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
    find_unused_parameters: false
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  # fp32 master weights with bf16 compute. bf16-true kept optimizer state in
  # bf16 and produced nan in the large-vocabulary forced-alignment arm.
  precision: bf16-mixed
  # Gates training_batch_wer, which runs a full greedy decode of the batch --
  # by far the most expensive thing logged. 100 rather than 10 keeps the curve
  # readable at a tenth of the cost and a tenth of the log volume.
  # train_loss is unaffected in the forced-alignment arms: they log it every
  # step, on the progress bar, so a collapse is still visible immediately.
  log_every_n_steps: 100
  enable_progress_bar: true
  num_sanity_val_steps: 1
  check_val_every_n_epoch: 1
  sync_batchnorm: true
  enable_checkpointing: false
  logger: false
  benchmark: false

exp_manager:
  exp_dir: null
  name: ${name}
  create_tensorboard_logger: false
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 5
    always_save_nemo: false
  resume_if_exists: true
  resume_ignore_no_checkpoint: true
  create_wandb_logger: true
  wandb_logger_kwargs:
    name: null
    project: null
