# Config for the CHAT EXTERNAL-ALIGNMENT cross-entropy BASELINE.
#
# Same cache-aware streaming FastConformer + CHAT (Chunk-wise Attention Transducer,
# RNNTAttJoint cross-attention joint) as fastconformer_chat_transducer_bpe_streaming.yaml.
# The ONLY difference is the TRAINING objective:
#
#   * fastconformer_chat_transducer_bpe_streaming.yaml (vanilla CHAT): full-sum
#     RNN-T loss over EVERY token->chunk alignment.
#   * THIS config (loss_type='chat_aligner'): a FROZEN external aligner fixes the
#     token->chunk assignment and the model trains with teacher-forced
#     cross-entropy over that single path (ChatExternalAlignerCELoss). This is the
#     external-alignment baseline (cf. "Chunkwise Aligners", arXiv:2605.11422)
#     adapted to the CHAT cross-attention joint.
#
# Inference / decoding / WER are identical to vanilla CHAT (ordinary greedy/beam
# RNN-T decoding over the chunk axis). The CHAT chunk a token is emitted in is
# encoder_frame // chunk_size, with chunk_size = att_context_size right + 1
# (inferred from the encoder, or set model.joint.chunk_size). Unlike the
# additive-joint Chunkwise Aligner, the CHAT cross-attention pools the whole chunk
# so a chunk may host arbitrarily many tokens (no left-packing constraint).
#
# External-alignment backends (model.external_aligner.backend):
#   * precomputed -- OFFLINE word-level alignment (RECOMMENDED, fastest). Run
#     scripts/asr_aligner/generate_qwen_word_alignments.py ONCE to dump per-word
#     start times keyed by file_id, then point `alignments_path` at it. Requires
#     model.train_ds.return_sample_id=true (and validation_ds) so each batch row
#     can be matched back to its precomputed alignment.
#   * qwen -- LIVE word-level forced alignment via Qwen3-ForcedAligner (slow).
#   * ctc  -- TOKEN-level CTC forced alignment (must share this model's tokenizer).

name: "FastConformer-CHAT-ExternalAligner-CE-BPE-Streaming"

model:
  sample_rate: 16000
  compute_eval_loss: true
  log_prediction: true
  skip_nan_grad: false

  # CHAT external-alignment cross-entropy objective (single fixed path).
  loss_type: "chat_aligner"

  # Frozen external aligner that fixes the token->chunk assignment.
  external_aligner:
    # 'precomputed' -> OFFLINE word-level alignment (fastest, recommended).
    # 'qwen'        -> LIVE word-level alignment (tokenizer-agnostic, slow).
    # 'ctc'         -> TOKEN-level CTC alignment (must share this model's tokenizer).
    backend: precomputed

    # Cross-entropy reduction over the fixed path: 'mean_volume' (per-token NLL,
    # comparable to the RNN-T scale) | 'mean' | 'mean_batch' | 'sum'.
    reduction: mean_volume

    # --- precomputed (offline word-level) backend ----------------------------
    # JSON/JSONL file or directory of {file_id: [word_start_sec, ...]} produced by
    # scripts/asr_aligner/generate_qwen_word_alignments.py. REQUIRES
    # model.train_ds.return_sample_id=true (and validation_ds.return_sample_id=true).
    alignments_path: null

    # --- qwen (live word-level) backend --------------------------------------
    model_name: "Qwen/Qwen3-ForcedAligner-0.6B"  # HF repo id or local dir
    language: English           # transcript language passed to the aligner
    dtype: bfloat16             # aligner compute dtype (bf16/fp16/fp32)
    device: null                # null -> same accelerator as the audio

    # --- ctc (token-level) backend -------------------------------------------
    model_path: null            # e.g. /pretrained/stt_en_fastconformer_ctc_large.nemo
    pretrained_name: null       # e.g. stt_en_fastconformer_ctc_large
    viterbi_device: null        # null -> same device as the audio

  model_defaults:
    enc_hidden: ${model.encoder.d_model}
    pred_hidden: 640
    joint_hidden: 640

  train_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: true
    num_workers: 8
    pin_memory: true
    max_duration: 20
    min_duration: 0.1
    # REQUIRED by backend='precomputed' to match each row to its offline alignment.
    return_sample_id: true
    # tarred datasets
    is_tarred: false
    tarred_audio_filepaths: null
    shuffle_n: 2048
    # bucketing params
    bucketing_strategy: "synced_randomized"
    bucketing_batch_size: null

  validation_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    return_sample_id: true
    num_workers: 8
    pin_memory: true

  test_ds:
    manifest_filepath: null
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 8
    pin_memory: true

  tokenizer:
    dir: ???
    type: bpe

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: ${model.sample_rate}
    normalize: "NA"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 80
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001
    pad_to: 0

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05

  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: ${model.preprocessor.features}
    feat_out: -1
    n_layers: 17
    d_model: 512
    use_bias: True

    # Sub-sampling parameters
    subsampling: dw_striding
    subsampling_factor: 8
    subsampling_conv_channels: 256
    causal_downsampling: true

    # Feed forward module's params
    ff_expansion_factor: 4

    # Multi-headed Attention Module's params
    self_attention_model: rel_pos
    n_heads: 8

    # Chunked attention context: CHAT chunk_size = right_context + 1 = 6.
    # look-ahead(secs) = 5 * 8 * 0.01 = 0.4s
    att_context_size: [72, 5]
    att_context_style: chunked_limited
    att_context_probs: null

    xscaling: true
    pos_emb_max_len: 5000

    # Convolution module's params
    conv_kernel_size: 9
    conv_norm_type: 'layer_norm'
    conv_context_size: causal

    ### regularization
    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1

    stochastic_depth_drop_prob: 0.0
    stochastic_depth_mode: linear
    stochastic_depth_start_layer: 1

  decoder:
    _target_: nemo.collections.asr.modules.RNNTDecoder
    normalization_mode: null
    random_state_sampling: false
    blank_as_pad: true

    prednet:
      pred_hidden: ${model.model_defaults.pred_hidden}
      pred_rnn_layers: 1
      t_max: null
      dropout: 0.2

  joint:
    _target_: nemo.collections.asr.modules.RNNTAttJoint
    log_softmax: null
    preserve_memory: false

    # chunk_size is auto-inferred from encoder att_context_size (right_context + 1 = 6).
    # Uncomment to override:
    # chunk_size: 6

    # fuse_loss_wer is not supported for CHAT
    fuse_loss_wer: false
    fused_batch_size: null

    jointnet:
      joint_hidden: ${model.model_defaults.joint_hidden}
      activation: "relu"
      dropout: 0.2

  decoding:
    strategy: "greedy_batch"

    greedy:
      max_symbols: 10

    beam:
      beam_size: 2
      return_best_hypothesis: False
      score_norm: true
      tsd_max_sym_exp: 50
      alsd_max_target_len: 2.0

  interctc:
    loss_weights: []
    apply_at_layers: []

  optim:
    name: adamw
    lr: 5.0
    betas: [0.9, 0.98]
    weight_decay: 1e-3

    sched:
      name: NoamAnnealing
      d_model: ${model.encoder.d_model}
      warmup_steps: 10000
      warmup_ratio: null
      min_lr: 1e-6

trainer:
  devices: -1
  num_nodes: 1
  max_epochs: 1000
  max_steps: -1
  val_check_interval: 1.0
  accelerator: auto
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: 32
  log_every_n_steps: 10
  enable_progress_bar: True
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  sync_batchnorm: true
  enable_checkpointing: False
  logger: false
  benchmark: false

exp_manager:
  exp_dir: null
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 5
    always_save_nemo: True
  resume_from_checkpoint: null
  resume_if_exists: false
  resume_ignore_no_checkpoint: false

  create_wandb_logger: false
  wandb_logger_kwargs:
    name: null
    project: null
