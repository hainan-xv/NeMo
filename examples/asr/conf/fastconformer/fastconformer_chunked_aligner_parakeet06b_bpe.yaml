# FastConformer-XL Chunked-Aligner config, architecture-matched to NVIDIA
# parakeet-tdt-0.6b-v2 (EncDecRNNTBPEModel, ~0.6B params) so the released encoder
# + prediction network can be warm-started from that .nemo.
#
# Difference vs the TDT reproduction config (fastconformer_tdt_parakeet06b_bpe):
#   * Training objective is the alignment-free streaming Chunked-Aligner full-sum
#     loss (model.loss_type=chunked_aligner). Emissions within a chunk are
#     left-packed onto the chunk's leading encoder frames and the blank symbol
#     doubles as an end-of-chunk (EOC) signal that advances to the next chunk.
#   * Plain RNNTJoint (NO TDT duration outputs), fuse_loss_wer=false (the chunked
#     aligner uses its own loss + chunked greedy decoding, so the joint cannot be
#     fused with the RNN-T loss/WER).
#   * The joint output space is V+1 (vocab + blank/EOC), so it does NOT match
#     parakeet's TDT joint (V+1+5); warm-start encoder + decoder only and train the
#     joint from scratch (see oci_chat/chunked_aligner.sh).
#
# Trained through examples/asr/asr_transducer/speech_to_text_rnnt_bpe.py
# (chunked_aligner is a loss_type on EncDecRNNTBPEModel, not a separate model).
#
# NOTE: use the tokenizer that ships INSIDE parakeet-tdt-0.6b-v2.nemo (extract it
# and point model.tokenizer.dir at that directory) so the warm-started decoder's
# embedding table matches.

name: "FastConformer-ChunkedAligner-Parakeet06b-BPE"

model:
  sample_rate: 16000
  # Chunked-aligner val loss runs the numba CUDA kernel; very long eval samples can
  # exhaust memory, so it is disabled by default (val WER is still computed from the
  # chunked greedy decoder). Set true to also log val_loss.
  compute_eval_loss: false
  log_prediction: true
  skip_nan_grad: false

  # ----- Chunked-Aligner objective -----
  # 'rnnt' (default) is the standard alignment-free RNN-T loss; 'chunked_aligner'
  # enables the chunked-aligner full-sum loss + chunked greedy decoding.
  loss_type: "chunked_aligner"
  chunked_aligner:
    chunk_size: 8            # number of encoder frames per chunk C (max tokens/chunk)
    # Per-token normalization ('mean_volume') keeps the loss ~ ln V at init and
    # comparable in scale to the RNN-T / TDT recipes (shared LR transferable).
    reduction: mean_volume
    clamp: -1.0
    nar: false              # only the autoregressive (AR) variant is supported here

  model_defaults:
    enc_hidden: ${model.encoder.d_model}
    pred_hidden: 640
    joint_hidden: 640

  train_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: true
    num_workers: 8
    pin_memory: true
    max_duration: 40.0
    min_duration: 0.1
    # Granary / ASR manifests use "text".
    text_field: text
    is_tarred: false
    tarred_audio_filepaths: null
    shuffle_n: 2048
    bucketing_strategy: "fully_randomized"
    bucketing_batch_size: null

  validation_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 8
    pin_memory: true

  test_ds:
    manifest_filepath: null
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 8
    pin_memory: true

  tokenizer:
    dir: ???  # directory that contains tokenizer.model (extracted from parakeet-tdt-0.6b-v2.nemo)
    type: bpe

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: ${model.sample_rate}
    normalize: "per_feature"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 128
    n_fft: 512
    log: true
    frame_splicing: 1
    dither: 0.00001
    pad_to: 0
    pad_value: 0.0

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05

  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: ${model.preprocessor.features}
    feat_out: -1
    n_layers: 24
    d_model: 1024
    use_bias: false

    # Sub-sampling parameters (8x FastConformer)
    subsampling: dw_striding
    subsampling_factor: 8
    subsampling_conv_channels: 256
    causal_downsampling: false

    reduction: null
    reduction_position: null
    reduction_factor: 1

    ff_expansion_factor: 4

    self_attention_model: rel_pos
    n_heads: 8
    att_context_size: [-1, -1] # full (offline) context
    att_context_style: regular
    xscaling: false
    untie_biases: true
    pos_emb_max_len: 5000

    conv_kernel_size: 9
    conv_norm_type: 'batch_norm'
    conv_context_size: null

    ### regularization
    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1

    stochastic_depth_drop_prob: 0.0
    stochastic_depth_mode: linear
    stochastic_depth_start_layer: 1

  decoder:
    _target_: nemo.collections.asr.modules.RNNTDecoder
    normalization_mode: null
    random_state_sampling: false
    blank_as_pad: true

    prednet:
      pred_hidden: ${model.model_defaults.pred_hidden}
      # Match parakeet-tdt-0.6b-v2 (2 LSTM layers) so the decoder warm-starts.
      pred_rnn_layers: 2
      t_max: null
      dropout: 0.2

  joint:
    _target_: nemo.collections.asr.modules.RNNTJoint
    log_softmax: null
    preserve_memory: false

    # Must be OFF for the chunked aligner (own loss + decoding, no fused RNN-T loss).
    fuse_loss_wer: false
    fused_batch_size: null

    jointnet:
      joint_hidden: ${model.model_defaults.joint_hidden}
      activation: "relu"
      dropout: 0.2

  decoding:
    # Chunked greedy decoding (ChunkedAlignerDecoding).
    max_symbols: null   # null -> bounded by the number of encoder frames
    loop_labels: true   # batched label-looping chunked greedy walk

  optim:
    name: adamw
    lr: 1e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3

    sched:
      name: CosineAnnealing
      warmup_steps: 15000
      warmup_ratio: null
      min_lr: 1e-6

trainer:
  devices: -1
  num_nodes: 1
  max_epochs: 500
  max_steps: -1
  val_check_interval: 1.0
  accelerator: auto
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
  accumulate_grad_batches: 1
  gradient_clip_val: 0.0
  precision: 32 # 16, 32, or bf16
  log_every_n_steps: 10
  enable_progress_bar: True
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  sync_batchnorm: false
  enable_checkpointing: False  # Provided by exp_manager
  logger: false  # Provided by exp_manager
  benchmark: false


exp_manager:
  exp_dir: null
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 5
    always_save_nemo: True
  resume_from_checkpoint: null
  resume_if_exists: false
  resume_ignore_no_checkpoint: false

  create_wandb_logger: false
  wandb_logger_kwargs:
    name: null
    project: null
