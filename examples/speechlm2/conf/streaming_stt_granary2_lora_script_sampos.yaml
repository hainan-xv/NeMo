# ============================================================================
# SCRIPT with SAMPLED POSITION SCHEME — Granary 2.0, LoRA, val_wer.
#
# Identical to streaming_stt_granary2_lora_script_flex.yaml except for how RoPE
# positions are laid out.
#
# DEFAULT ("branch"): a branch takes positions right after its history, so it
# reads [history] <vs> audio <ve> words as one causal run. The audio therefore
# sits BETWEEN the history and the words it predicts. A word is adjacent to words
# from the SAME chunk but window+3 positions away from the word before it if that
# one came from the PREVIOUS chunk -- so the same transcript has different
# geometry depending on where the chunk boundaries fell. Concretely, predicting
# "two" after "one" is offset 1 when both land in one chunk and offset 7 when
# they are split, for a 4-frame window.
#
# HERE ("sampled"): one of the two layouts is drawn PER BATCH, like the chunk
# size, with probability continuous_prob of "continuous".
#
# HONEST CAVEAT. This is augmentation over a factor that does NOT vary at
# inference -- you decode with exactly one layout (val_position_scheme). And the
# two schemes are not two views of one fact: under "branch" the offset between
# consecutive words reveals whether a chunk boundary fell between them, and
# "continuous" erases precisely that. Sampling therefore makes offset 1
# sometimes mean "same chunk" and sometimes "different chunk", trading a usable
# cue for robustness to both layouts. Measured evidence so far is that the two
# schemes tie (contpos 8.23 / 6.54 / 5.93 vs baseline 8.04 / 6.54 / 5.96 at
# chunks 2/7/14), so treat this as an experiment, not an expected win.
#
# For reference, "continuous": the branch is shifted left by window+2 so its predicted
# words land on exactly the positions the spine gives them. Text becomes one
# continuous sequence in position space and the chunking is invisible to it; the
# audio window instead overlaps the tail of the history, which is the intent --
# the audio and the words it realises describe the same moment.
#
# This matters most for a PROMPT-CONTROLLED model, where the same utterance is
# carved differently at every latency setting, so the model currently has to
# learn each geometry separately.
#
# WHY THIS IS SAFE. Masking was decoupled from RoPE geometry: build_script_mask
# and the FlexAttention predicate now read `order_ids` (spine index / branch
# offset), not `position_ids`. So moving positions cannot change who attends to
# whom -- test_mask_is_identical_under_both_position_schemes -- and the exactness
# property still holds under both schemes
# (test_parity_packed_vs_separate_examples is parametrised over them).
#
# Positions can go negative here and are lifted by a constant; RoPE depends only
# on differences, so a uniform shift is a no-op.
# ============================================================================
model:
  pretrained_llm: /lustre/fsw/portfolios/llmservice/users/heh/pretrained_models/huggingface/Qwen/Qwen3-1.7B
  pretrained_asr: /lustre/fsw/portfolios/llmservice/users/heh/pretrained_models/huggingface/nvidia/nemotron-speech-streaming-en-0.6b/nemotron-speech-streaming-en-0.6b.nemo
  load_llm_weights: true
  load_asr_weights: true

  sample_rate: 16000
  blank_token: ""            # no-blank: silent chunks emit <|im_end|>
  frame_length_in_secs: 0.08
  chunk_size: [2, 4, 7, 10, 14, 28]   # multi chunk-size: one drawn per batch
  att_context_size: [70, 1]  # left 70; right (look-ahead) set per batch to chunk-1
  audio_pad_to: 0

  # --- Attention backend (the only change from the baseline recipe) ---
  # dense | flex | script -- all mathematically identical. See the header for
  # measured memory/step-time; decoding always falls back to SDPA.
  attn_backend: flex
  activation_checkpointing: true

  # --- Position scheme ---
  # Must match data.dataset.position_scheme (script_train.py asserts this).
  position_scheme: sampled
  # Decoding needs a concrete layout; "sampled" has no meaning for one forward.
  val_position_scheme: continuous

  # --- SCRIPT ---
  # M: each branch's audio window spans chunks [k-M .. k]. 0 = current chunk only.
  # Must match data.dataset.audio_history_chunks (script_train.py asserts this).
  audio_history_chunks: 0

  # Decode-only validation. val_chunk_size pins one well-supported chunk size
  # instead of the largest candidate (whose look-ahead can be slow to stream).
  val_chunk_size: 14
  # Bound the per-chunk prefill at inference (0 = unlimited full history).
  max_history_tokens: 0
  # Sub-batch size for the offline encode; keeps subsampling conv tensors within
  # 32-bit CUDA indexing on long, length-sorted clips.
  encode_batch_size: 8
  log_detailed_train_metrics: false

  freeze_speech_encoder: false
  freeze_modality_adapter: false
  freeze_modality_proj: false
  freeze_llm_model: true
  freeze_llm_head: false
  freeze_embed_tokens: false

  freeze_params: []
  prevent_freeze_params: []

  lora:
    task_type: CAUSAL_LM
    r: 128
    lora_alpha: 256
    lora_dropout: 0.01

  perception:
    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
    encoder:
      # The cache-aware encoder otherwise all-reduces max audio length every
      # forward, which desyncs the data-dependent validation decode across ranks.
      sync_max_audio_length: false

  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    foreach: true

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 10000
    min_lr: 1e-6
    max_steps: ${trainer.max_steps}

data:
  # --- ScriptSTTDataset config ---
  dataset:
    sample_rate: ${model.sample_rate}
    frame_length_in_secs: ${model.frame_length_in_secs}
    chunk_size: ${model.chunk_size}
    audio_history_chunks: ${model.audio_history_chunks}
    position_scheme: ${model.position_scheme}
    continuous_prob: 0.5      # P(continuous) per batch; sampling is data-side only
    position_seed: 91011
    num_delay_frames: 3
    audio_tag: "<audio>"
    blank_token: ${model.blank_token}
    system_role: system
    system_prompt: "You are doing streaming speech recognition. Given the transcript so far and the representation of the next audio chunk, output the words spoken in that chunk."

  # Decode-only val_wer runs generate() on raw audio; pin a single fixed size.
  val_dataset_overrides:
    chunk_size: 14

  # --- Lhotse dataloader config ---
  train_ds:
    sample_rate: ${data.dataset.sample_rate}
    input_cfg: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_speechlm/users/dongjig/aligned_amos/granary_v2_en_pnc_qwen_aligned_filtered/granary_v2_en_pnc_qwen_aligned_filtered_safe_iad_s3_audio.yaml
    skip_missing_manifest_entries: true
    manifest_filepath: null
    seed: 42
    shuffle: true
    shard_seed: "randomized"
    num_workers: 8
    force_iterable_dataset: true
    use_bucketing: true
    bucket_duration_bins: [4.32,6.0,7.04,7.92,8.8,9.6,10.4,11.12,11.89,12.66,13.47,14.8,16.92,20.0,22.4,29.44,35.0,39.6]
    bucket_batch_size: [38,29,25,22,20,18,17,15,14,13,12,11,10,8,7,6,5,4]
    max_duration: 54
    pad_extra_duration: 0.5
    pad_extra_duration_prob: 1.0

  validation_ds:
    datasets:
      mcv_11_dev:
        manifest_filepath: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_speechlm/users/dongjig/aligned_amos/steve_val_mmlpc_mcv11_2k/mcv11_dev_clean_pcstrip_en_2k_qwen_aligned.json
    sample_rate: ${data.dataset.sample_rate}
    batch_size: 4
    num_workers: 4
    seed: 42
    shard_seed: "randomized"
    shuffle: false
    pad_extra_duration: 0.5
    pad_extra_duration_prob: 1.0

trainer:
  devices: -1
  accelerator: gpu
  num_nodes: 1
  precision: bf16-true
  logger: false
  enable_checkpointing: false
  use_distributed_sampler: false
  max_steps: 200000
  limit_train_batches: 2000
  val_check_interval: ${trainer.limit_train_batches}
  log_every_n_steps: 10
  num_sanity_val_steps: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
    find_unused_parameters: true


exp_manager:
  exp_dir: null
  explicit_log_dir: null
  name: streaming_stt_granary2_script_flex
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  use_datetime_version: true
  max_time_per_run: "00:03:50:00"

  resume_from_checkpoint: null
  resume_if_exists: true
  resume_ignore_no_checkpoint: true

  create_wandb_logger: false
  wandb_logger_kwargs:
    name: ${exp_manager.name}
    project: null
    resume: true

  checkpoint_callback_params:
    filename: "{step}-{val_wer:.4f}"
    monitor: val_wer
    mode: min
    every_n_train_steps: null
    every_n_epochs: 1
    save_top_k: 5
    always_save_nemo: false
    save_nemo_on_train_end: false
