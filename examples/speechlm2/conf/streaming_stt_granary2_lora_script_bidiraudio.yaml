# ============================================================================
# SCRIPT with BIDIRECTIONAL AUDIO inside each branch — Granary 2.0, LoRA, val_wer.
#
# Identical to streaming_stt_granary2_lora_script_flex.yaml except for one mask
# rule: a branch's audio block now attends ITSELF BOTH WAYS, so an early frame in
# a chunk sees a later one. Text after the audio stays causal, which makes each
# branch an ordinary prefix-LM run over [history] <vs> audio <ve> words.
#
# WHY THIS IS STREAMING-LEGAL. Every frame of the block has already arrived when
# the branch starts -- the model waits for the chunk boundary either way -- so
# nothing about the future leaks. The encoder is untouched and remains
# chunk-limited, so the acoustic dependency structure is exactly as before.
#
# WHY IT IS FREE. The within-branch block is materialised and then masked in all
# three backends, so unmasking entries costs no extra FLOPs. What changes is only
# which entries survive.
#
# WHAT IT ACTUALLY BUYS. Note the ENCODER is ALREADY bidirectional within a chunk
# under chunked_limited, so each audio embedding entering the LLM already
# summarises its whole chunk: this adds no new acoustic information. And the word
# tokens sit after the audio, so under the causal rule they already attend every
# frame. The change therefore only refines the audio positions' own hidden states
# -- i.e. the keys/values the text subsequently reads -- which is a second-order
# effect. It brings the LLM-side rule into agreement with the encoder's.
#
# WHERE TO MEASURE IT. The effect scales with the size of the audio block. At
# chunk 2 with no window the block is 2 frames and the rule is nearly vacuous; at
# chunk 14/28 the block is large but every variant already ties there. The
# informative cell is a LARGE audio window at a SMALL chunk (i.e. combine with
# audio_window_frames=28 and evaluate at chunk 2), where the block is big and the
# models still separate.
#
# KNOWN RISK. The LLM was pretrained strictly causally and has never seen a
# negative relative RoPE offset. RoPE handles them fine (rotation by -theta), but
# warm-starting a causal checkpoint into this rule is a real distribution shift
# the fine-tune has to absorb; expect the first few thousand steps to look worse.
#
# NOT COMPATIBLE WITH FSM DECODE (use_state_machine_inference): that path ingests
# the window one frame at a time behind a KV cache, so it cannot represent this
# rule and the model refuses rather than mis-decoding.
#
# WARM START from granary2_script_baseline.
# ============================================================================
model:
  pretrained_llm: /lustre/fsw/portfolios/llmservice/users/heh/pretrained_models/huggingface/Qwen/Qwen3-1.7B
  pretrained_asr: /lustre/fsw/portfolios/llmservice/users/heh/pretrained_models/huggingface/nvidia/nemotron-speech-streaming-en-0.6b/nemotron-speech-streaming-en-0.6b.nemo
  load_llm_weights: true
  load_asr_weights: true

  sample_rate: 16000
  blank_token: ""            # no-blank: silent chunks emit <|im_end|>
  frame_length_in_secs: 0.08
  chunk_size: [2, 4, 7, 10, 14, 28]   # multi chunk-size: one drawn per batch
  att_context_size: [70, 1]  # left 70; right (look-ahead) set per batch to chunk-1
  audio_pad_to: 0

  # --- Attention backend (the only change from the baseline recipe) ---
  # dense | flex | script -- all mathematically identical. See the header for
  # measured memory/step-time; decoding always falls back to SDPA.
  attn_backend: flex
  activation_checkpointing: true

  # --- Bidirectional audio ---
  # Mask-side only: the data already carries is_audio, so unlike full_context or
  # position_scheme there is no paired dataset field to keep in sync.
  bidirectional_audio: true

  # --- SCRIPT ---
  # M: each branch's audio window spans chunks [k-M .. k]. 0 = current chunk only.
  # Must match data.dataset.audio_history_chunks (script_train.py asserts this).
  audio_history_chunks: 0

  # Decode-only validation. val_chunk_size pins one well-supported chunk size
  # instead of the largest candidate (whose look-ahead can be slow to stream).
  val_chunk_size: 14
  # Bound the per-chunk prefill at inference (0 = unlimited full history).
  max_history_tokens: 0
  # Sub-batch size for the offline encode; keeps subsampling conv tensors within
  # 32-bit CUDA indexing on long, length-sorted clips.
  encode_batch_size: 8
  log_detailed_train_metrics: false

  freeze_speech_encoder: false
  freeze_modality_adapter: false
  freeze_modality_proj: false
  freeze_llm_model: true
  freeze_llm_head: false
  freeze_embed_tokens: false

  freeze_params: []
  prevent_freeze_params: []

  lora:
    task_type: CAUSAL_LM
    r: 128
    lora_alpha: 256
    lora_dropout: 0.01

  perception:
    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
    encoder:
      # The cache-aware encoder otherwise all-reduces max audio length every
      # forward, which desyncs the data-dependent validation decode across ranks.
      sync_max_audio_length: false

  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    foreach: true

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 10000
    min_lr: 1e-6
    max_steps: ${trainer.max_steps}

data:
  # --- ScriptSTTDataset config ---
  dataset:
    sample_rate: ${model.sample_rate}
    frame_length_in_secs: ${model.frame_length_in_secs}
    chunk_size: ${model.chunk_size}
    audio_history_chunks: ${model.audio_history_chunks}
    num_delay_frames: 3
    audio_tag: "<audio>"
    blank_token: ${model.blank_token}
    system_role: system
    system_prompt: "You are doing streaming speech recognition. Given the transcript so far and the representation of the next audio chunk, output the words spoken in that chunk."

  # Decode-only val_wer runs generate() on raw audio; pin a single fixed size.
  val_dataset_overrides:
    chunk_size: 14

  # --- Lhotse dataloader config ---
  train_ds:
    sample_rate: ${data.dataset.sample_rate}
    input_cfg: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_speechlm/users/dongjig/aligned_amos/granary_v2_en_pnc_qwen_aligned_filtered/granary_v2_en_pnc_qwen_aligned_filtered_safe_iad_s3_audio.yaml
    skip_missing_manifest_entries: true
    manifest_filepath: null
    seed: 42
    shuffle: true
    shard_seed: "randomized"
    num_workers: 8
    force_iterable_dataset: true
    use_bucketing: true
    bucket_duration_bins: [4.32,6.0,7.04,7.92,8.8,9.6,10.4,11.12,11.89,12.66,13.47,14.8,16.92,20.0,22.4,29.44,35.0,39.6]
    bucket_batch_size: [38,29,25,22,20,18,17,15,14,13,12,11,10,8,7,6,5,4]
    max_duration: 54
    pad_extra_duration: 0.5
    pad_extra_duration_prob: 1.0

  validation_ds:
    datasets:
      mcv_11_dev:
        manifest_filepath: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_speechlm/users/dongjig/aligned_amos/steve_val_mmlpc_mcv11_2k/mcv11_dev_clean_pcstrip_en_2k_qwen_aligned.json
    sample_rate: ${data.dataset.sample_rate}
    batch_size: 4
    num_workers: 4
    seed: 42
    shard_seed: "randomized"
    shuffle: false
    pad_extra_duration: 0.5
    pad_extra_duration_prob: 1.0

trainer:
  devices: -1
  accelerator: gpu
  num_nodes: 1
  precision: bf16-true
  logger: false
  enable_checkpointing: false
  use_distributed_sampler: false
  max_steps: 200000
  limit_train_batches: 2000
  val_check_interval: ${trainer.limit_train_batches}
  log_every_n_steps: 10
  num_sanity_val_steps: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
    find_unused_parameters: true


exp_manager:
  exp_dir: null
  explicit_log_dir: null
  name: streaming_stt_granary2_script_flex
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  use_datetime_version: true
  max_time_per_run: "00:03:50:00"

  resume_from_checkpoint: null
  resume_if_exists: true
  resume_ignore_no_checkpoint: true

  create_wandb_logger: false
  wandb_logger_kwargs:
    name: ${exp_manager.name}
    project: null
    resume: true

  checkpoint_callback_params:
    filename: "{step}-{val_wer:.4f}"
    monitor: val_wer
    mode: min
    every_n_train_steps: null
    every_n_epochs: 1
    save_top_k: 5
    always_save_nemo: false
    save_nemo_on_train_end: false
