        residual: false
        separable: true
        se: true
        se_context_size: -1
        kernel_size_factor: 0.25
        future_context: 0
      _target_: nemo.collections.asr.modules.ConvASREncoder
    preprocessor:
      _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
      sample_rate: 16000
      normalize: per_feature
      window_size: 0.025
      window_stride: 0.01
      window: hann
      features: 80
      n_fft: 512
      frame_splicing: 1
      dither: 1.0e-05
      pad_to: 16
      stft_conv: false
  optimizer:
    _target_: torch.optim.AdamW
    lr: 0.0001
    betas:
    - 0.9
    - 0.98
    weight_decay: 0.001
    # false, unlike every Conformer arm. The Citrinet front-end leaves 46 of its
    # parameters in float32 while the rest of the model is bfloat16 (measured in
    # the step=15062 checkpoint: 1062 bf16 + 46 fp32 params, and the optimizer
    # state mirrors it). foreach AdamW groups state by (device, dtype) and dies
    # on that mix when resuming:
    #   RuntimeError: Tensors of the same index must be on the same device and
    #   the same dtype except `step` tensors ...
    # raised from torch._C._group_tensors_by_device_and_dtype. It killed 21647132
    # and 21661519 at ~4:44, which is why this arm could not pass a 4-hour leg
    # boundary. The Conformer arms are uniformly bf16, so they never hit it.
    #
    # foreach=false takes the per-tensor loop instead: identical math, no
    # grouping. Casting those 46 to bf16 would also 'fix' it, but they are left
    # fp32 on purpose -- that is a precision change, not a kernel change.
    foreach: false
  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 10000
    min_lr: 1.0e-06
    max_steps: ${trainer.max_steps}
data:
  dataset:
    sample_rate: ${model.sample_rate}
    frame_length_in_secs: ${model.frame_length_in_secs}
    chunk_size: ${model.chunk_size}
    audio_history_chunks: ${model.audio_history_chunks}
    prompt_control: ${model.prompt_control}
    prompt_include_chunk_size: ${model.prompt_include_chunk_size}
    delay_candidates:
    - 0
    - 1
    - 2
    - 3
    - 4
    capitalization_prob: 0.5
    punctuation_prob: 0.5
    random_first_chunk: false
    control_seed: 5678
    num_delay_frames: 3
    audio_tag: <audio>
    blank_token: ${model.blank_token}
    system_role: system
    system_prompt: You are doing streaming speech recognition. Given the transcript
      so far and the representation of the next audio chunk, output the words spoken
      in that chunk.
  val_dataset_overrides:
    chunk_size: 14
    prompt_control: false
    random_first_chunk: false
  train_ds:
    sample_rate: ${data.dataset.sample_rate}
    input_cfg: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_speechlm/users/dongjig/aligned_amos/granary_v2_en_pnc_qwen_aligned_filtered/granary_v2_en_pnc_qwen_aligned_filtered_safe_iad_s3_audio.yaml
    skip_missing_manifest_entries: true
    manifest_filepath: null
    seed: 42
    shuffle: true
    shard_seed: randomized
    num_workers: 8
    force_iterable_dataset: true
    use_bucketing: true
    bucket_duration_bins:
    - 4.32
    - 6.0
    - 7.04
    - 7.92
    - 8.8
    - 9.6
    - 10.4
    - 11.12
    - 11.89
