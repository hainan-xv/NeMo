  pretrained_asr: PLACEHOLDER_CITRINET
  load_llm_weights: true
  load_asr_weights: true
  sample_rate: 16000
  blank_token: ''
  frame_length_in_secs: 0.08
  chunk_size:
  - 14
  # null, NOT [84, 1]: a ConvASREncoder has no attention, so there is no
  # look-ahead to match per chunk. Its receptive field is architectural --
  # 6.02 s of left context and 0.00 s of look-ahead, fixed by future_context=0
  # on all 23 blocks. Leaving a value here would make _set_encoder_att_context
  # write dead attributes onto the conv stack every batch.
  att_context_size: null
  audio_pad_to: 0
  attn_backend: flex
  bidirectional_audio: false
  modality_local_layers: 0
  activation_checkpointing: true
  audio_history_chunks: 0
  prompt_control: true
  prompt_include_chunk_size: true
  val_chunk_size: 14
  val_num_delay_frames: 3
  val_capitalization: true
  val_punctuation: true
  max_history_tokens: 0
  encode_batch_size: 8
  log_detailed_train_metrics: false
  freeze_speech_encoder: false
  freeze_modality_adapter: false
  freeze_modality_proj: false
  freeze_llm_model: false
  freeze_llm_head: false
  freeze_embed_tokens: false
