# ============================================================================
# Chunk-completion streaming SpeechLM — Granary 2.0, LoRA, no-blank, val_wer.
# UNIFIED PROMPT-CONTROLLED variant: ONE model whose three streaming knobs are all
# stated explicitly in the prompt, each drawn per batch:
#
#  1) CHUNK SIZE (data.dataset.chunk_size_prompt_template): the per-batch chunk
#     size (one of model.chunk_size, in frames) is rendered into the prompt
#     ("Process the audio in chunks of N frames."). At inference you request a
#     chunk size by writing that number in the prompt.
#
#  2) EXACT DELAY / LATENCY (data.dataset.exact_delay=true, num_delay_frames=-1):
#     each batch samples an integer delay ~ Uniform[0, exact_max_delay] frames and
#     renders it into the prompt ("... with a fixed delay of N frames."). At
#     inference you request an exact latency by writing that number.
#
#  3) SELF-CORRECTION on/off (data.dataset.self_correction=true, forced/DAgger,
#     data.dataset.self_correction_batch_prob): with prob p a batch is trained WITH
#     the delete-last-word objective (the model re-decodes its own errors and learns
#     "<del> w_prev w_k"), and the prompt says it MAY correct; with prob 1-p the
#     batch is a plain chunk-completion batch and the prompt says it must NOT go back
#     and change words. At inference the prompt's clause turns correction on/off.
#     Each branch conditions on 2 chunks of audio (audio_history_chunks=1: previous +
#     current) so a mis-committed word's own audio is inside the window and can be
#     re-read to delete + re-emit.
#
# Also inherits TEXT REPRESENTATION variation (vary_text_repr): per-batch (cap x
# punct) combo stated in the prompt and applied to the targets.
#
# WARM-START: initialize from the latest _promptctl checkpoint (set INIT_CKPT in the
# launcher) so this run only has to learn the two new prompt clauses (chunk size +
# correction) on top of an already prompt-controlled delay/text-repr model.
#
# Everything else (packed spine+branch objective, multi chunk-size, att_context,
# LoRA, data, optimizer, trainer, val_wer) is inherited from the promptctl recipe.
# ============================================================================

model:
  pretrained_llm: /lustre/fsw/portfolios/llmservice/users/heh/pretrained_models/huggingface/Qwen/Qwen3-1.7B
  pretrained_asr: /lustre/fsw/portfolios/llmservice/users/heh/pretrained_models/huggingface/nvidia/nemotron-speech-streaming-en-0.6b/nemotron-speech-streaming-en-0.6b.nemo
  load_llm_weights: true
  load_asr_weights: true

  sample_rate: 16000
  blank_token: ""            # no-blank: silent chunks emit <|im_end|>
  frame_length_in_secs: 0.08
  chunk_size: [2, 4, 7, 10, 14, 28]   # multi chunk-size: one drawn per batch (and stated in the prompt)
  att_context_size: [70, 1]  # left 70; right (lookahead) is set per batch to chunk-1
  audio_pad_to: 0

  # --- Self-correction (delete-last-word), FORCED / DAgger ---
  # Enable the delete token + the DAgger training step (runs on batches that carry
  # chunk_meta, i.e. the per-batch correction-ON batches; see data.dataset below).
  # Also enables <del> handling in generate() at inference.
  self_correction: true
  delete_token: "<|object_ref_start|>"   # reused in-vocab Qwen special token (no embedding resize)
  self_correction_prob: 1.0              # per-chunk: inject a correction target for every detected last-word error
  self_correction_log_every: 200

  # Always 2 chunks of audio per branch (previous + current). Kept in the MODEL config
  # so generate() rebuilds the same window after from_pretrained.
  audio_history_chunks: 1

  # Compact template flag is irrelevant to the chunk-completion layout (it builds
  # its own spine+branch structure), but kept for config compatibility.
  compact_template: true

  freeze_speech_encoder: false
  freeze_modality_adapter: false
  freeze_modality_proj: false
  freeze_llm_model: true
  freeze_llm_head: false
  freeze_embed_tokens: false

  freeze_params: []
  prevent_freeze_params: []

  lora:
    task_type: CAUSAL_LM
    r: 128
    lora_alpha: 256
    lora_dropout: 0.01

  perception:
    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
    encoder:
      # Per-rank-independent decode (see the no-blank recipe): the cache-aware
      # encoder otherwise all-reduces max audio length every forward, desyncing
      # the data-dependent streaming validation decode across ranks.
      sync_max_audio_length: false

  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    foreach: true

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 10000
    min_lr: 1e-6
    max_steps: ${trainer.max_steps}

data:
  # --- ChunkCompletionSTTDataset config ---
  dataset:
    sample_rate: ${model.sample_rate}
    frame_length_in_secs: ${model.frame_length_in_secs}
    chunk_size: ${model.chunk_size}
    num_delay_frames: -1  # -1 activates prompt-controlled delay (exact mode below)
    audio_tag: "<audio>"
    blank_token: ${model.blank_token}
    compact_template: ${model.compact_template}
    system_role: system

    # --- (1) Chunk-size prompting ---
    # The per-batch chunk size (frames) is rendered here and appended to the prompt.
    chunk_size_prompt_template: "Process the audio in chunks of {chunk_size} frames."

    # --- (2) Exact-delay prompting ---
    exact_delay: true
    exact_max_delay: 4    # sample delay ~ Uniform[0, 4] frames per batch

    # --- Text-representation variation ---
    vary_text_repr: true
    text_repr_keep_chars: "'"   # keep apostrophes when stripping punctuation

    # --- (3) Self-correction via FORCED / DAgger, toggled per batch ---
    self_correction: true
    self_correction_batch_prob: 0.5   # ~half the batches train WITH the delete objective
    delete_token: ${model.delete_token}
    # 2-chunk audio window (must match model.audio_history_chunks).
    audio_history_chunks: ${model.audio_history_chunks}
    # Prompt clauses that STATE whether the model may correct (ON) or not (OFF).
    self_correction_prompt_suffix: "If a word you already wrote turns out to be wrong given the new audio, delete it and write the correct word."
    no_self_correction_prompt_suffix: "Do not go back and change words you already wrote."

    # Validation prompt (model.val_system_prompt reads data.dataset.system_prompt).
    # Must equal the training render for (delay=2, cap+punct, chunk=14, correction
    # OFF) so val is in-distribution; the val references are plain cap+punct
    # transcripts with no <del>. Clause order matches the append order in the
    # dataset: base template -> chunk clause -> correction clause.
    system_prompt: "You are doing streaming speech recognition. Given the transcript so far and the next audio chunk, output the words spoken in that chunk. Emit each chunk's words with a fixed delay of 2 frames. Write the text with normal capitalization and punctuation. Process the audio in chunks of 14 frames. Do not go back and change words you already wrote."

  # Decode-only val_wer runs generate() on raw audio; pin a single fixed size
  # (must match the chunk count stated in system_prompt above).
  val_dataset_overrides:
    chunk_size: 14

  # --- Lhotse dataloader config ---
  train_ds:
    sample_rate: ${data.dataset.sample_rate}
    input_cfg: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_speechlm/users/dongjig/aligned_amos/granary_v2_en_pnc_qwen_aligned_filtered/granary_v2_en_pnc_qwen_aligned_filtered_safe_iad_s3_audio.yaml
    skip_missing_manifest_entries: true
    manifest_filepath: null
    seed: 42
    shuffle: true
    shard_seed: "randomized"
    num_workers: 8
    force_iterable_dataset: true
    use_bucketing: true
    bucket_duration_bins: [4.32,6.0,7.04,7.92,8.8,9.6,10.4,11.12,11.89,12.66,13.47,14.8,16.92,20.0,22.4,29.44,35.0,39.6]
    bucket_batch_size: [38,29,25,22,20,18,17,15,14,13,12,11,10,8,7,6,5,4]
    max_duration: 54
    pad_extra_duration: 0.5
    pad_extra_duration_prob: 1.0

  validation_ds:
    datasets:
      mcv_11_dev:
        manifest_filepath: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_speechlm/users/dongjig/aligned_amos/steve_val_mmlpc_mcv11_2k/mcv11_dev_clean_pcstrip_en_2k_qwen_aligned.json
    sample_rate: ${data.dataset.sample_rate}
    batch_size: 4
    num_workers: 4
    seed: 42
    shard_seed: "randomized"
    shuffle: false
    pad_extra_duration: 0.5
    pad_extra_duration_prob: 1.0

trainer:
  devices: -1
  accelerator: gpu
  num_nodes: 1
  precision: bf16-true
  logger: false
  enable_checkpointing: false
  use_distributed_sampler: false
  max_steps: 200000
  limit_train_batches: 2000
  val_check_interval: ${trainer.limit_train_batches}
  log_every_n_steps: 10
  num_sanity_val_steps: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
    find_unused_parameters: true


exp_manager:
  exp_dir: null
  explicit_log_dir: null
  name: streaming_stt_granary2_chunkcompletion_promptctl_all
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  use_datetime_version: true
  max_time_per_run: "00:03:50:00"

  resume_from_checkpoint: null
  resume_if_exists: true
  resume_ignore_no_checkpoint: true

  create_wandb_logger: false
  wandb_logger_kwargs:
    name: ${exp_manager.name}
    project: null
    resume: true

  checkpoint_callback_params:
    filename: "{step}-{val_wer:.4f}"
    monitor: val_wer
    mode: min
    every_n_train_steps: null
    every_n_epochs: 1
    save_top_k: 5
    always_save_nemo: false
    save_nemo_on_train_end: false
