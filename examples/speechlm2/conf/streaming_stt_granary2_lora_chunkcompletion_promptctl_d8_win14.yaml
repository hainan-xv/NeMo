# ============================================================================
# Chunk-completion streaming SpeechLM — Granary 2.0, LoRA, no-blank, val_wer.
# PROMPT-CONTROLLED + FIXED-FRAME-WINDOW variant (built on the _promptctl_d8 model,
# exact delay 0..8 + text-representation).
#
# FIXED AUDIO WINDOW (model.audio_window_frames=14): each chunk's branch conditions
# on a CONSTANT 14 encoder frames ending at the chunk boundary, regardless of the
# chunk size drawn for that batch (emission granularity). To keep the context truly
# "always 14", the chunk_size list is capped at 14 here (a 28-frame chunk would
# force a 28-frame window, since the window never drops a chunk's own frames). This
# reuses the windowed-audio machinery (audio_frame_index gather) but sizes the
# window by frames, not chunks.
#
# The two prompt-controlled knobs are unchanged, both batch-shared (one setting per
# batch so the system prompt can be reused and no per-sample prompt bookkeeping is
# needed):
#
#  1) EXACT DELAY (data.dataset.exact_delay=true, needs num_delay_frames=-1):
#     each batch samples an integer delay ~ Uniform[0, exact_max_delay] frames,
#     sets num_delay_frames to it, and renders the number directly into the
#     prompt ("... with a fixed delay of N frames."). At inference you request an
#     exact latency by writing that number in the prompt. Replaces the vague
#     natural-language delay_prompts list.
#
#  2) TEXT REPRESENTATION (data.dataset.vary_text_repr=true): each batch samples
#     one of the 4 (capitalization on/off) x (punctuation on/off) combos, states
#     it in the prompt, and transforms the chunk TARGET text accordingly. At
#     inference you pick punctuation/capitalization via the prompt.
#
# Everything else (packed spine+branch objective, multi chunk-size, att_context,
# LoRA, data, optimizer, trainer, val_wer) is inherited from the delay-prompt
# recipe. Backward compatible: both knobs default off elsewhere.
# ============================================================================

model:
  pretrained_llm: /lustre/fsw/portfolios/llmservice/users/heh/pretrained_models/huggingface/Qwen/Qwen3-1.7B
  pretrained_asr: /lustre/fsw/portfolios/llmservice/users/heh/pretrained_models/huggingface/nvidia/nemotron-speech-streaming-en-0.6b/nemotron-speech-streaming-en-0.6b.nemo
  load_llm_weights: true
  load_asr_weights: true

  sample_rate: 16000
  blank_token: ""            # no-blank: silent chunks emit <|im_end|>
  frame_length_in_secs: 0.08
  # Capped at 14 (dropped 28) so the fixed 14-frame audio window applies uniformly;
  # a chunk > 14 would keep all its own frames (window floor) and break "always 14".
  chunk_size: [2, 4, 7, 10, 14]   # multi chunk-size: one drawn per batch
  att_context_size: [70, 1]  # left 70; right (lookahead) is set per batch to chunk-1
  audio_pad_to: 0
  # Fixed acoustic context: every branch sees the last 14 encoder frames ending at
  # the chunk boundary, independent of the chunk size. Kept in the MODEL config so
  # generate() rebuilds the same window after from_pretrained.
  audio_window_frames: 14

  # Compact template flag is irrelevant to the chunk-completion layout (it builds
  # its own spine+branch structure), but kept for config compatibility.
  compact_template: true

  freeze_speech_encoder: false
  freeze_modality_adapter: false
  freeze_modality_proj: false
  freeze_llm_model: true
  freeze_llm_head: false
  freeze_embed_tokens: false

  freeze_params: []
  prevent_freeze_params: []

  lora:
    task_type: CAUSAL_LM
    r: 128
    lora_alpha: 256
    lora_dropout: 0.01

  perception:
    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
    encoder:
      # Per-rank-independent decode (see the no-blank recipe): the cache-aware
      # encoder otherwise all-reduces max audio length every forward, desyncing
      # the data-dependent streaming validation decode across ranks.
      sync_max_audio_length: false

  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    foreach: true

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 10000
    min_lr: 1e-6
    max_steps: ${trainer.max_steps}

data:
  # --- ChunkCompletionSTTDataset config ---
  dataset:
    sample_rate: ${model.sample_rate}
    frame_length_in_secs: ${model.frame_length_in_secs}
    chunk_size: ${model.chunk_size}
    num_delay_frames: -1  # -1 activates prompt-controlled delay (exact mode below)
    audio_tag: "<audio>"
    blank_token: ${model.blank_token}
    compact_template: ${model.compact_template}
    system_role: system

    # --- Exact-delay prompting ---
    exact_delay: true
    exact_max_delay: 8    # sample delay ~ Uniform[0, 8] frames per batch (wider latency range than the _promptctl (max 4) variant)

    # --- Text-representation variation ---
    vary_text_repr: true
    text_repr_keep_chars: "'"   # keep apostrophes when stripping punctuation

    # --- Fixed-frame audio window (must match model.audio_window_frames) ---
    audio_window_frames: ${model.audio_window_frames}

    # Validation prompt (model.val_system_prompt reads data.dataset.system_prompt).
    # Must equal the training render for (delay=2, capitalization+punctuation) so
    # val is in-distribution; the val references are original cap+punct transcripts.
    system_prompt: "You are doing streaming speech recognition. Given the transcript so far and the next audio chunk, output the words spoken in that chunk. Emit each chunk's words with a fixed delay of 2 frames. Write the text with normal capitalization and punctuation."

  # Decode-only val_wer runs generate() on raw audio; pin a single fixed size.
  val_dataset_overrides:
    chunk_size: 14

  # --- Lhotse dataloader config ---
  train_ds:
    sample_rate: ${data.dataset.sample_rate}
    input_cfg: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_speechlm/users/dongjig/aligned_amos/granary_v2_en_pnc_qwen_aligned_filtered/granary_v2_en_pnc_qwen_aligned_filtered_safe_iad_s3_audio.yaml
    skip_missing_manifest_entries: true
    manifest_filepath: null
    seed: 42
    shuffle: true
    shard_seed: "randomized"
    num_workers: 8
    force_iterable_dataset: true
    use_bucketing: true
    bucket_duration_bins: [4.32,6.0,7.04,7.92,8.8,9.6,10.4,11.12,11.89,12.66,13.47,14.8,16.92,20.0,22.4,29.44,35.0,39.6]
    bucket_batch_size: [38,29,25,22,20,18,17,15,14,13,12,11,10,8,7,6,5,4]
    max_duration: 54
    pad_extra_duration: 0.5
    pad_extra_duration_prob: 1.0

  validation_ds:
    datasets:
      mcv_11_dev:
        manifest_filepath: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_speechlm/users/dongjig/aligned_amos/steve_val_mmlpc_mcv11_2k/mcv11_dev_clean_pcstrip_en_2k_qwen_aligned.json
    sample_rate: ${data.dataset.sample_rate}
    batch_size: 4
    num_workers: 4
    seed: 42
    shard_seed: "randomized"
    shuffle: false
    pad_extra_duration: 0.5
    pad_extra_duration_prob: 1.0

trainer:
  devices: -1
  accelerator: gpu
  num_nodes: 1
  precision: bf16-true
  logger: false
  enable_checkpointing: false
  use_distributed_sampler: false
  max_steps: 200000
  limit_train_batches: 2000
  val_check_interval: ${trainer.limit_train_batches}
  log_every_n_steps: 10
  num_sanity_val_steps: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
    find_unused_parameters: true


exp_manager:
  exp_dir: null
  explicit_log_dir: null
  name: streaming_stt_granary2_chunkcompletion_promptctl_d8_win14
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  use_datetime_version: true
  max_time_per_run: "00:03:50:00"

  resume_from_checkpoint: null
  resume_if_exists: true
  resume_ignore_no_checkpoint: true

  create_wandb_logger: false
  wandb_logger_kwargs:
    name: ${exp_manager.name}
    project: null
    resume: true

  checkpoint_callback_params:
    filename: "{step}-{val_wer:.4f}"
    monitor: val_wer
    mode: min
    every_n_train_steps: null
    every_n_epochs: 1
    save_top_k: 5
    always_save_nemo: false
    save_nemo_on_train_end: false
