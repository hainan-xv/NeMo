# ============================================================================
# PROMPT-CONTROLLED SCRIPT — Granary 2.0, LoRA, no-blank, val_wer.
#
# Same model and data as streaming_stt_granary2_lora_script_flex.yaml. The one
# change: four decoding settings are DRAWN per example and STATED in that
# example's instruction, so a single checkpoint serves every operating point and
# the caller selects one at inference by asking for it in words.
#
#   chunk size    drawn per BATCH from model.chunk_size (it fixes the encoder's
#                 right context to chunk-1, so it cannot vary within a batch)
#   delay         drawn per EXAMPLE from data.dataset.delay_candidates
#   capitalization  drawn per EXAMPLE, p = capitalization_prob
#   punctuation     drawn per EXAMPLE, p = punctuation_prob
#
# The instruction then reads, e.g.:
#
#   <base prompt> The audio is chunked every 14 frames with an emission delay of
#   3 frames. Use capitalization. Do not use punctuation.
#
# Targets are restyled to match the draw, so the supervision and the instruction
# always agree. Training and inference build that sentence with the SAME function
# (parts/script_prompt.py: render_control_prompt) -- a wording difference between
# them would be silent out-of-distribution decoding.
#
# NOTE ON EVALUATION: the Open-ASR-Leaderboard normalizer lowercases and strips
# punctuation before scoring, so the cap/punct settings do NOT move leaderboard
# WER. They need a scorer that keeps case and punctuation to be measured.
# ============================================================================
model:
  pretrained_llm: /lustre/fsw/portfolios/llmservice/users/heh/pretrained_models/huggingface/Qwen/Qwen3-1.7B
  pretrained_asr: /lustre/fsw/portfolios/llmservice/users/heh/pretrained_models/huggingface/nvidia/nemotron-speech-streaming-en-0.6b/nemotron-speech-streaming-en-0.6b.nemo
  load_llm_weights: true
  load_asr_weights: true

  sample_rate: 16000
  blank_token: ""            # no-blank: silent chunks emit <|im_end|>
  frame_length_in_secs: 0.08
  # UNIFIED STREAMING + OFFLINE. One model, 100% shared parameters, TWO operating
  # points: chunk 14 (streaming, 1.12 s stride) and chunk 1024, which at
  # max_duration 54 s (675 frames) always swallows the utterance whole and so IS the
  # offline case. Offline is not a separate mode here, just the far end of the same
  # axis -- which is what makes this one model rather than two.
  #
  # The draw is PER BATCH (script_dataset.py, seeded by chunk_size_seed and offset
  # per worker), so every step trains one operating point and the model sees all of
  # them over a run.
  #
  # How the model knows its operating point: audio_window_frames=0 and
  # audio_history_chunks=2 make the window 3*chunk, so the window width
  # already encodes the latency. The prompt deliberately does NOT name the chunk
  # size (prompt_include_chunk_size stays false, set by the launcher): naming it
  # makes the prompts of two operating points diverge at the chunk-size digit, which
  # destroys the shared KV prefix that self-correction depends on.
  chunk_size: [14, 1024]
  # Left context 84, NOT 70. The Conformer's chunked_limited check requires
  #   att_context_size[0] % (att_context_size[1] + 1) == 0
  # and the right context is set per batch to chunk_size - 1, so the left
  # context must DIVIDE every supported chunk size. 70 fails for the new
  # sizes (70 % 28 = 14, 70 % 42 = 28); 84 divides 2/7/14/28/42 exactly.
  # The pretrained 0.6b encoder was trained at left 70, but att_context_size
  # is masking config rather than a weight shape, so warm start loads clean --
  # verified by building that checkpoint at [84,1] and decoding all five sizes.
  # NULL for the encoder-free front-end. A stacked frame sees exactly its own 8
  # mel frames and nothing beyond them, so there is no attention look-ahead to
  # configure. _set_encoder_att_context() returns immediately when this is None,
  # which is what we want: it would otherwise assign att_context_size /
  # att_chunk_offset onto a module that has no attention at all.
  # Latency is now ONLY the chunk boundary.
  att_context_size: null
  audio_pad_to: 0

  # --- Attention backend (the only change from the baseline recipe) ---
  # dense | flex | script -- all mathematically identical. See the header for
  # measured memory/step-time; decoding always falls back to SDPA.
  attn_backend: flex
  # Let each branch's audio block attend ITSELF both ways. The whole chunk
  # has already arrived when the branch starts and the model waits for the
  # boundary regardless, so this is streaming-legal and costs no FLOPs --
  # the block is computed then masked either way. Declared here so Hydra
  # accepts a plain override; struct mode refuses unknown keys.
  bidirectional_audio: false
  # MODALITY-LOCAL EARLY LAYERS: n=14. For the first 14 LLM layers audio attends
  # only to audio in its own branch -- no emitted-text prefix, no [vs]/[ve]/span.
  # Text is already modality-local at every layer and is unchanged.
  # n=0 is the control and reproduces the unified model exactly.
  modality_local_layers: 14
  activation_checkpointing: true

  # --- SCRIPT ---
  # M: each branch's audio window spans chunks [k-M .. k]. 0 = current chunk only.
  # Must match data.dataset.audio_history_chunks (script_train.py asserts this).
  # 2, so the window is (M + 1) * chunk = 3 * chunk:
  #     chunk   14 -> 42 frames (3.36 s)  -- EXACTLY the warm-start parent's window
  #     chunk 1024 -> 3072 frames         -- far beyond any utterance, so offline
  # Matching the parent's geometry at the streaming point is what makes the warm
  # start carry: nocoder_sa trained chunk 14 with a fixed 42-frame window, so this
  # run starts from a model whose streaming operating point is already correct and
  # only has to absorb the offline one. It also keeps the window WIDTH as the
  # latency signal, which is why the prompt need not name the chunk size.
  audio_history_chunks: 2
  # F > 0 gives every branch a FIXED window of F frames ending at its chunk
  # boundary, so the acoustic context is constant and INDEPENDENT of chunk size;
  # it takes precedence over audio_history_chunks. With chunk_size as the stride,
  # (F, chunk) = (42, 14) means overlapping windows: 42 frames of audio seen,
  # advancing 14 each step.
  #
  # WHY: with non-overlapping windows the window IS the chunk, so a small chunk
  # cannot contain a whole word -- chunk 2 is 160ms. Decoupling the two lets the
  # emission stride stay short while the model still sees enough audio to
  # resolve a word. Declared here (not only on the dataclass) because Hydra
  # struct mode refuses to set a key the config does not already contain.
  audio_window_frames: 0

  # --- Prompt control ---
  # Must match data.dataset.prompt_control (script_train.py asserts this).
  # generate() renders the control sentence through the same function the
  # dataset used, and rejects the knobs outright when this is false.
  prompt_control: true
  # Whether the instruction NAMES the chunk size. False makes the instruction
  # chunk-size independent, so two fronts decoding at different chunk sizes
  # share one [instruction][history] prefix -- and therefore one prefill. The
  # chunk size stays learnable because the audio window is exactly that wide.
  # data.dataset interpolates this, so one override flips both and they can
  # never disagree.
  prompt_include_chunk_size: true

  # Decode-only validation. val_chunk_size pins one well-supported chunk size
  # instead of the largest candidate (whose look-ahead can be slow to stream).
  # The other three pin the operating point validation decodes at; references
  # are restyled to match, so val_wer measures recognition, not style.
  # A single int, so in-training val_wer can only track ONE operating point. Pinned
  # at 14 for continuity with the existing table (nocoder_sa 0.1888 etc.); the
  # offline end is measured separately with launch/dfw_eval_nocoder_offline.sh.
  val_chunk_size: 14
  # SECOND validation point, logged to wandb as val_wer_offline. Without this the
  # offline end of this model is invisible during training -- val_chunk_size is a
  # single int, so wandb's val_wer has only ever shown chunk 14, which is exactly
  # how a model that is best-in-class at streaming (0.1823) and poor at offline
  # (44.86 macro) looked healthy for two legs.
  val_offline_chunk_size: 1024
  # 256, because the budget is PER CHUNK and one chunk here is the whole utterance
  # (~162 tokens for a 54 s example). Reusing the chunk-14 budget of 24 would
  # measure truncation, not the model.
  val_offline_max_new_tokens: 256
  val_num_delay_frames: 3
  val_capitalization: true
  val_punctuation: true
  # Bound the per-chunk prefill at inference (0 = unlimited full history).
  max_history_tokens: 0
  # Sub-batch size for the offline encode; keeps subsampling conv tensors within
  # 32-bit CUDA indexing on long, length-sorted clips.
  encode_batch_size: 8
  log_detailed_train_metrics: false

  freeze_speech_encoder: false
  freeze_modality_adapter: false
  freeze_modality_proj: false
  # FALSE for full finetuning. This flag -- not the lora block -- is what keeps
  # Qwen3 frozen: _apply_freeze_config() freezes self.llm.model whenever it is
  # true, regardless of LoRA. Removing `lora:` while leaving this true gave a
  # model with NO language-side learning capacity (922M trainable, all encoder)
  # and training diverged to val_wer 4.22.
  freeze_llm_model: false
  freeze_llm_head: false
  freeze_embed_tokens: false

  freeze_params: []
  prevent_freeze_params: []

  # NO lora block -> FULL finetuning. The model gates on `if "lora" in cfg`,
  # so removing it leaves the whole Qwen3-1.7B trainable alongside the encoder.
  #
  # Why: with LoRA the adapter defaulted to q_proj/v_proj only (PEFT's Qwen3
  # default), so the LLM could reweight what it attends to but could not change
  # any feedforward transform. That made the encoder the only component able to
  # learn acoustic refinement, which confounds every encoder-look-ahead result:
  # a causal-encoder arm could not have been rescued by the LLM even in
  # principle. Full finetuning removes that confound.
  perception:
    # SpecAugment, absent from every other SCRIPT config here. It is the standard
    # cheap substitute for the robustness a PRETRAINED encoder provides for free,
    # and the error profile says that is exactly what this model lacks: at chunk
    # 14 it scores 4.47 on LibriSpeech-clean but 21.98 on AMI and 25.28 on
    # earnings22. Masks are applied to the MEL spectrogram, i.e. before the
    # stacking reshape, and only during training -- AudioPerceptionModule skips
    # them in eval. Values are the ones the interleaved recipe in this repo ships.
    spec_augment:
      _target_: nemo.collections.asr.modules.SpectrogramAugmentation
      freq_masks: 2
      time_masks: 10
      freq_width: 27
      time_width: 0.05

    # The pretrained nemotron ships normalize: NA -- its Conformer's convolutions
    # and LayerNorms absorb the log-mel scale, so raw features were fine. With
    # the encoder removed there is NOTHING between log-mel and the LLM's first
    # attention layer, and log-mel has a large arbitrary offset and wide dynamic
    # range while Qwen3's text embeddings are ~unit scale. Normalising here stops
    # proj having to absorb that mismatch on its own.
    #
    # CAVEAT: per_feature uses WHOLE-UTTERANCE statistics, so a frame's features
    # depend on audio that arrives later. That is fine for training and for
    # offline scoring, but it is NOT streaming-legal -- for a true streaming
    # claim this must become fixed global mean/std computed once over the corpus.
    preprocessor:
      normalize: per_feature
    # Two-layer MLP with ReLU instead of a single affine map; 4 x the LLM width.
    # 1024 -> 8192 -> 2048 is ~25M params against the 609M Conformer we removed.
    proj_hidden_dim: 8192
    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
    # ENCODER-FREE. The 609M-parameter Conformer is replaced by a reshape: 8
    # consecutive 128-bin mel frames are concatenated into one 1024-d vector.
    #
    # The dimensions line up exactly with the Conformer this replaces --
    # 128 mel x 8 = 1024 = its d_model, and 8 x 10ms = 0.08s = its frame -- so
    # `proj` (1024 -> LLM hidden) and every frame-counted quantity in SCRIPT
    # (chunk_size, num_delay_frames, the two-front windows) are untouched.
    #
    # Declaring a _target_ different from the pretrained ASR encoder's makes
    # setup_perception take this block WHOLESALE rather than merging it onto the
    # Conformer config, so none of the Conformer's keys reach this constructor.
    # That is also why sync_max_audio_length is absent: there is no cache-aware
    # encoder left to all-reduce anything.
    encoder:
      _target_: nemo.collections.speechlm2.modules.stacking_encoder.StackingEncoder
      feat_in: 128
      subsampling_factor: 8
      d_model: 1024

  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    foreach: true

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 10000
    min_lr: 1e-6
    max_steps: ${trainer.max_steps}

data:
  # --- ScriptSTTDataset config ---
  dataset:
    sample_rate: ${model.sample_rate}
    frame_length_in_secs: ${model.frame_length_in_secs}
    chunk_size: ${model.chunk_size}
    audio_history_chunks: ${model.audio_history_chunks}
    audio_window_frames: ${model.audio_window_frames}

    # --- Prompt control (paired with model.prompt_control) ---
    prompt_control: ${model.prompt_control}
    prompt_include_chunk_size: ${model.prompt_include_chunk_size}
    # Delays in frames (0.08s each): 0 -> 0.00s ... 8 -> 0.64s. num_delay_frames
    # below is the fallback used only when prompt_control is off.
    delay_candidates: [0, 1, 2, 3, 4]
    capitalization_prob: 0.5
    punctuation_prob: 0.5
    # Draw the FIRST chunk's width per batch so chunk boundaries are not locked
    # to multiples of chunk_size. Declared here (not only on the dataclass) so
    # Hydra will accept a plain override -- struct mode refuses to set a key the
    # config does not already contain.
    random_first_chunk: false
    control_seed: 5678
    num_delay_frames: 3
    audio_tag: "<audio>"
    blank_token: ${model.blank_token}
    system_role: system
    system_prompt: "You are doing streaming speech recognition. Given the transcript so far and the representation of the next audio chunk, output the words spoken in that chunk."

  # Decode-only val_wer runs generate() on raw audio; pin a single fixed size.
  val_dataset_overrides:
    chunk_size: 14
    # Validation is decode-only: it uses the audio and batch.text, never the
    # constructed targets, and the operating point comes from the model's val_*
    # settings. Drawing controls here would just add nondeterminism, so leave it off.
    prompt_control: false
    # Validation stays on the UNIFORM grid even when training randomises it, so
    # val_wer remains comparable with every earlier run. The point of the
    # ragged grid is to remove the model's dependence on grid phase; whether it
    # worked is measured by re-running the phase sweep on the checkpoint, not
    # by a val_wer computed on shifted grids.
    random_first_chunk: false

  # --- Lhotse dataloader config ---
  train_ds:
    sample_rate: ${data.dataset.sample_rate}
    input_cfg: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_speechlm/users/dongjig/aligned_amos/granary_v2_en_pnc_qwen_aligned_filtered/granary_v2_en_pnc_qwen_aligned_filtered_safe_iad_s3_audio.yaml
    skip_missing_manifest_entries: true
    manifest_filepath: null
    seed: 42
    shuffle: true
    shard_seed: "randomized"
    num_workers: 8
    force_iterable_dataset: true
    use_bucketing: true
    bucket_duration_bins: [4.32,6.0,7.04,7.92,8.8,9.6,10.4,11.12,11.89,12.66,13.47,14.8,16.92,20.0,22.4,29.44,35.0,39.6]
    bucket_batch_size: [38,29,25,22,20,18,17,15,14,13,12,11,10,8,7,6,5,4]
    max_duration: 54
    pad_extra_duration: 0.5
    pad_extra_duration_prob: 1.0

  validation_ds:
    datasets:
      mcv_11_dev:
        manifest_filepath: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_speechlm/users/dongjig/aligned_amos/steve_val_mmlpc_mcv11_2k/mcv11_dev_clean_pcstrip_en_2k_qwen_aligned.json
    sample_rate: ${data.dataset.sample_rate}
    batch_size: 4
    num_workers: 4
    seed: 42
    shard_seed: "randomized"
    shuffle: false
    pad_extra_duration: 0.5
    pad_extra_duration_prob: 1.0

trainer:
  devices: -1
  accelerator: gpu
  num_nodes: 1
  precision: bf16-true
  logger: false
  enable_checkpointing: false
  use_distributed_sampler: false
  max_steps: 200000
  limit_train_batches: 2000
  val_check_interval: ${trainer.limit_train_batches}
  log_every_n_steps: 10
  num_sanity_val_steps: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
    find_unused_parameters: true


exp_manager:
  exp_dir: null
  explicit_log_dir: null
  name: streaming_stt_granary2_script_flex
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  use_datetime_version: true
  max_time_per_run: "00:03:50:00"

  resume_from_checkpoint: null
  resume_if_exists: true
  resume_ignore_no_checkpoint: true

  create_wandb_logger: false
  wandb_logger_kwargs:
    name: ${exp_manager.name}
    project: null
    resume: true

  checkpoint_callback_params:
    filename: "{step}-{val_wer:.4f}"
    monitor: val_wer
    mode: min
    every_n_train_steps: null
    every_n_epochs: 1
    save_top_k: 5
    always_save_nemo: false
    save_nemo_on_train_end: false
