model:
  pretrained_llm: Qwen/Qwen3-1.7B
  pretrained_asr: nvidia/nemotron-speech-streaming-en-0.6b
  load_llm_weights: true
  load_asr_weights: true

  sample_rate: 16000
  blank_token: "<blank>"
  frame_length_in_secs: 0.08
  # --- Multi chunk-size training ---
  # A list of positive frame counts enables multi chunk-size training: one value
  # is drawn at random per batch. Inference defaults to the longest value (here
  # 13); override per call with generate(chunk_size_override=N) or the eval
  # script's chunk_size_override. All entries must be positive (fixed chunking);
  # this cannot be combined with dynamic (0) / offline (-1) modes.
  chunk_size: [14]
  # Encoder attention look-ahead. The LEFT context (70) is fixed; the RIGHT
  # context (look-ahead) is set automatically each batch to (chunk_size - 1) and
  # at inference to (resolved_chunk_size - 1). The value below is the default for
  # the longest chunk (14 -> 13); only the left entry is authoritative.
  att_context_size: [70, 13]
  audio_pad_to: 16

  freeze_speech_encoder: false
  freeze_modality_adapter: false
  freeze_modality_proj: false
  freeze_llm_model: false
  freeze_llm_head: false
  freeze_embed_tokens: false

  freeze_params: []
  prevent_freeze_params: []  # Use to make specific submodules trainable; overrides freeze_params


  # LoRA (uncomment to enable)

  perception:
    # Normalised log-mel. The pretrained nemotron ships normalize: NA because its
    # 24-layer Conformer absorbs the scale; a 3-layer front-end has much less
    # capacity to do that, so normalise explicitly -- same choice as the SCRIPT
    # enc3 arm this is meant to be compared against.
    preprocessor:
      normalize: per_feature

    # STRUCTURE ONLY: keep the pretrained encoder's shape but not its weights, so
    # this measures the interleaved ARCHITECTURE against SCRIPT with a matched
    # front-end, not pretrained-feature transfer.
    random_init_encoder: true

    encoder:
      # pre_encode (dw_striding, 8x subsampling) + 3 conformer layers. Keeps the
      # 0.08s frame, so frame_length_in_secs and chunk_size keep their meaning.
      n_layers: 3
      # Cache-aware encoder: without this it all-reduces max audio length every
      # forward, desyncing the data-dependent validation decode across ranks.
      sync_max_audio_length: false

    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector

  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    foreach: true

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 10000
    min_lr: 1e-6
    max_steps: ${trainer.max_steps}

data:
  # --- StreamingSTTDataset config ---
  dataset:
    sample_rate: ${model.sample_rate}
    frame_length_in_secs: ${model.frame_length_in_secs}
    # Inherits the multi chunk-size list from model.chunk_size; the dataset draws
    # one value per batch and records it in StreamingSTTBatch.chunk_size so the
    # model can match the encoder look-ahead.
    chunk_size: ${model.chunk_size}
    num_delay_frames: 0
    audio_tag: "<audio>"
    blank_token: ${model.blank_token}
    system_role: system
    system_prompt: "Transcribe the audio into text."

  val_dataset_overrides:
    chunk_size: 14

  # --- Lhotse dataloader config ---
  train_ds:
    sample_rate: ${data.dataset.sample_rate}
    input_cfg: null
    # The granary2 shards have a few manifest/tar mismatches. Without this the
    # dataloader raises
    #   RuntimeError: Mismatched entry between JSON manifest and tar file
    # and kills the job; with it the offending tar is skipped. The SCRIPT arms
    # set this too, so both see the same data policy.
    skip_missing_manifest_entries: true
    manifest_filepath: null
    seed: 42
    shuffle: true
    shard_seed: "randomized"
    num_workers: 4
    # Bucketing ON, mirroring the SCRIPT enc3 arm so the two see the same batch
    # composition. The launch script overrides the bins and sizes, but Hydra's
    # struct mode refuses to SET a key the config does not already contain --
    # leaving these out made the job die immediately with
    #   Error: Key 'bucket_batch_size' is not in struct
    batch_size: null
    use_bucketing: true
    bucket_duration_bins: [4.32,6.0,7.04,7.92,8.8,9.6,10.4,11.12,11.89,12.66,13.47,14.8,16.92,20.0]
    bucket_batch_size: [38,29,25,22,20,18,17,15,14,13,12,11,10,8]
    max_duration: 20

  validation_ds:
    datasets:
      mcv_11_dev:
        input_cfg: null
        manifest_filepath: null
    sample_rate: ${data.dataset.sample_rate}
    batch_size: 4
    num_workers: 4
    seed: 42
    shard_seed: "randomized"

trainer:
  devices: -1
  accelerator: gpu
  num_nodes: 1
  precision: bf16-true
  logger: false
  enable_checkpointing: false
  use_distributed_sampler: false
  max_steps: 100000
  limit_train_batches: 5000
  val_check_interval: ${trainer.limit_train_batches}
  limit_val_batches: 10
  log_every_n_steps: 10
  num_sanity_val_steps: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
    find_unused_parameters: true


exp_manager:
  exp_dir: null
  explicit_log_dir: null
  name: streaming_stt_multichunk
  create_tensorboard_logger: false
  create_checkpoint_callback: true
  use_datetime_version: true
  max_time_per_run: "00:03:50:00"

  resume_from_checkpoint: null
  resume_if_exists: true
  resume_ignore_no_checkpoint: true

  create_wandb_logger: false
  wandb_logger_kwargs:
    name: ${exp_manager.name}
    project: null
    resume: true

  checkpoint_callback_params:
    filename: "{step}"
    monitor: val_acc
    mode: max
    every_n_train_steps: null
    every_n_epochs: 1
    save_top_k: 1
    always_save_nemo: false
    save_nemo_on_train_end: false
